<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 4 - Mathematics - Number File 1 | PEP Practice Centre</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{background:#f0f4f8;color:#1a202c;padding:16px}
  .wrap{max-width:700px;margin:0 auto}
  .top{background:#1e40af;color:#fff;padding:22px 18px;border-radius:16px;text-align:center}
  .top small{background:#facc15;color:#111;padding:4px 10px;border-radius:20px;font-weight:800;font-size:12px}
  .top h1{font-size:24px;margin:10px 0 4px}
  .top p{font-size:14px;opacity:.9}
  .card{background:#fff;border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .q-num{color:#1e40af;font-weight:800;font-size:13px;text-transform:uppercase}
  .q-text{font-size:17px;font-weight:700;margin:8px 0 12px;line-height:1.4}
  .opt{display:block;width:100%;text-align:left;background:#f1f5f9;border:2px solid #e2e8f0;padding:12px 14px;border-radius:10px;margin-bottom:8px;font-size:15px;cursor:pointer}
  .opt:hover{border-color:#1e40af;background:#eff6ff}
  .opt.correct{background:#dcfce7;border-color:#16a34a}
  .opt.wrong{background:#fee2e2;border-color:#dc2626}
  .feedback{font-size:14px;font-weight:700;margin-top:6px;display:none}
  .feedback.show{display:block}
  .feedback.good{color:#16a34a}
  .feedback.bad{color:#dc2626}
  .score-bar{background:#fff;border-radius:14px;padding:16px;margin-top:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  #score{font-size:22px;font-weight:800;color:#1e40af}
  .btn{background:#16a34a;color:#fff;border:none;padding:13px 18px;border-radius:10px;font-size:16px;font-weight:800;width:100%;margin-top:12px;cursor:pointer}
  .btn2{background:#1e40af;color:#fff;text-decoration:none;display:block;text-align:center;padding:13px;border-radius:10px;font-weight:800;margin-top:10px}
  .btn3{background:#e2e8f0;color:#111;text-decoration:none;display:block;text-align:center;padding:12px;border-radius:10px;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <small>PEP PRACTICE CENTRE • GRADE 4</small>
    <h1>Mathematics - Number File 1</h1>
    <p>20 Questions • 6 Ministry Sample-Style + 14 NSC Original • Place Value, Operations, Fractions, Decimals & Money</p>
  </div>
  <div class="score-bar">Your Score: <span id="score">0 / 20</span><br><small id="msg">Answer all questions.</small></div>
  <div id="quiz"></div>
  <button class="btn" onclick="resetQuiz()">Try Again ↻</button>
  <a class="btn2" href="grade4-pep.html">← Back to PEP Practice Centre</a>
  <a class="btn3" href="grade4-hub.html">Back to Grade Hub</a>
</div>
<script>
const questions=[
{q:"What is the value of the 7 in 7,482?",o:["7","70","700","7,000"],a:3,why:"7 is in thousands place = 7,000."},
{q:"Which number is greater than 5,640?",o:["5,604","5,460","5,649","5,406"],a:2,why:"5,649 > 5,640."},
{q:"What is 4,356 + 2,187?",o:["6,543","6,433","6,453","6,533"],a:0,why:"4,356 + 2,187 = 6,543."},
{q:"What is 6,000 - 1,275?",o:["4,725","4,825","5,725","4,625"],a:0,why:"6,000 - 1,275 = 4,725."},
{q:"What is 18 × 5?",o:["80","90","85","95"],a:1,why:"18 × 5 = 90."},
{q:"What is 96 ÷ 8?",o:["11","12","10","14"],a:1,why:"96 ÷ 8 = 12."},
{q:"Which fraction is equal to 1/2?",o:["2/4","1/4","3/4","2/3"],a:0,why:"2/4 = 1/2."},
{q:"What is 1/2 of 14?",o:["6","7","8","5"],a:1,why:"14 ÷ 2 = 7."},
{q:"Which decimal is equal to 3/10?",o:["0.3","0.03","3.0","0.33"],a:0,why:"3/10 = 0.3"},
{q:"Sara has $500. She spends $275. How much left?",o:["$225","$235","$215","$325"],a:0,why:"$500 - $275 = $225."},
{q:"Which number is the smallest? 9,802 , 9,208 , 9,820 , 9,028",o:["9,802","9,208","9,820","9,028"],a:3,why:"9,028 is smallest."},
{q:"What is 3,205 + 1,496?",o:["4,601","4,701","4,611","5,701"],a:1,why:"3,205 + 1,496 = 4,701."},
{q:"What is 5,000 - 2,347?",o:["2,653","2,753","3,653","2,563"],a:0,why:"5,000 - 2,347 = 2,653."},
{q:"What is 23 × 4?",o:["82","92","84","102"],a:1,why:"23 × 4 = 92."},
{q:"What is 72 ÷ 9?",o:["7","8","9","6"],a:1,why:"72 ÷ 9 = 8."},
{q:"Which fraction is GREATER than 1/2?",o:["1/4","2/5","3/4","1/3"],a:2,why:"3/4 > 1/2."},
{q:"What is 3/4 of 20?",o:["10","12","15","18"],a:2,why:"20 ÷ 4 = 5, 5 × 3 = 15."},
{q:"Which decimal is equal to 7/10?",o:["0.07","0.7","7.0","0.17"],a:1,why:"7/10 = 0.7"},
{q:"Jamal has $1,000. He buys 2 pens at $150 each. How much left?",o:["$700","$850","$600","$750"],a:0,why:"2 × $150 = $300. $1,000 - $300 = $700."},
{q:"A baker makes 5 boxes with 36 cupcakes in each box. How many total?",o:["150","180","160","175"],a:1,why:"5 × 36 = 180."}
];
let score=0, answered={};
const quizEl=document.getElementById('quiz');
function build(){
  quizEl.innerHTML=''; score=0; answered={};
  document.getElementById('score').textContent='0 / 20';
  document.getElementById('msg').textContent='Answer all questions.';
  questions.forEach((item,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="q-num">Question ${i+1} of 20</div><div class="q-text">${item.q}</div><div id="opts-${i}"></div><div class="feedback" id="fb-${i}"></div>`;
    quizEl.appendChild(d);
    const opts=document.getElementById(`opts-${i}`);
    item.o.forEach((opt,j)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=()=>check(i,j,b); opts.appendChild(b);
    });
  });
}
function check(i,j,btn){
  if(answered[i]) return; answered[i]=true;
  const fb=document.getElementById(`fb-${i}`);
  const all=document.querySelectorAll(`#opts-${i} .opt`);
  if(j===questions[i].a){ btn.classList.add('correct'); score++; fb.textContent='✅ Correct! '+questions[i].why; fb.className='feedback show good'; }
  else{ btn.classList.add('wrong'); all[questions[i].a].classList.add('correct'); fb.textContent='❌ Not quite. '+questions[i].why; fb.className='feedback show bad'; }
  document.getElementById('score').textContent=score+' / 20';
  if(Object.keys(answered).length===20){
    document.getElementById('msg').textContent = score>=16 ? 'Excellent! PEP ready! 🎉' : score>=10 ? 'Good work! Try again to get 16+.' : 'Keep practising — try again!';
  }
}
function resetQuiz(){ build(); window.scrollTo({top:0,behavior:'smooth'}); }
build();
</script>
</body>
</html>
