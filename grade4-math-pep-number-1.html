<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 4 PEP - Mathematics</title>
<style>
body{margin:0;font-family:Arial;background:#eef2ff;padding:12px}
.wrap{max-width:520px;margin:0 auto;background:#fff;padding:14px;border-radius:22px}
.header{background:#1e3a5f;color:#fff;text-align:center;padding:28px 16px;border-radius:18px}
.header h1{margin:0;font-size:26px;line-height:1.3;font-weight:900}
.header p{margin:12px 0 0;font-size:16px;opacity:.9}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}
.tab{padding:10px 18px;border-radius:30px;border:0;background:#e0e0e0;font-weight:700;cursor:pointer}
.tab.active{background:#1e3a5f;color:#fff}
.qhead{font-weight:700}
.q{font-size:22px;font-weight:800;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:16px;border:2px solid #ddd;border-radius:12px;margin:10px 0;background:#fff;font-size:19px}
.opt.sel{border-color:#1e3a5f;background:#e3f2fd;font-weight:700}
.btn{display:block;width:100%;padding:18px;border:0;border-radius:14px;font-size:19px;font-weight:800;color:#fff;margin-top:14px;cursor:pointer}
.blue{background:#1e3a5f}.green{background:#25D366}.grey{background:#888}
input{width:100%;padding:16px;border:2px solid #ddd;border-radius:12px;font-size:17px;box-sizing:border-box;margin-top:14px}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
.popup.show{display:flex}.popbox{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:22px;text-align:center}
</style></head><body><div class="wrap">
<div class="header"><h1>🇯🇲 Grade 4 PEP - Mathematics<br>100 Questions - 5 Tests</h1><p>Test 1-5 • 20 questions each • Final score recorded automatically</p></div>
<div class="tabs" id="tabs"></div>
<div id="quiz"><div class="qhead" id="qh"></div><div class="q" id="qq"></div><div id="opts"></div><button class="btn blue" onclick="nxt()">Next →</button></div>
<div id="res" style="display:none;text-align:center;padding:20px;background:#e8f5e9;border-radius:12px;font-size:20px;font-weight:800;margin-top:14px"></div>
<a href="grade4-pep-practice.html" style="text-decoration:none"><button class="btn blue">← Back to PEP Practice Centre</button></a></div>
<div class="popup" id="pop"><div class="popbox"><h2>🎉 Test Finished!</h2><p id="ps"></p><p>Send this score to parent on WhatsApp?</p><input id="wn" placeholder="Parent WhatsApp e.g. 1876..."><button class="btn green" onclick="sendWA()">Send on WhatsApp 📲</button><button class="btn grey" onclick="closeP()">Close / Next Test →</button></div></div>
<script>
let raw=[
"Value of 5 in 3,542?|5|50|500|5,000|2~456+237?|683|693|703|613|1~800-365?|435|445|465|535|0~7x8?|54|56|48|64|1~72÷9?|6|7|8|9|2~Equal to 1/2?|2/4|3/5|1/3|4/6|0~Hexagon sides?|5|6|7|8|1~Perimeter square side 6cm?|12cm|18cm|24cm|36cm|2~1 hour in minutes?|30|45|60|90|2~$5.50+$2.25?|$7.25|$7.75|$7.50|$8.00|1~Which is odd?|24|36|47|58|2~Round 347 to nearest 10|340|350|300|400|1~1/4 of 20?|4|5|6|10|1~Cm in 2 metres?|20|100|200|2000|2~9x6?|48|54|56|63|1~Largest?|0.5|0.25|0.75|0.1|2~Next: 5,10,15,20,?|22|25|30|24|1~24 mangoes shared by 4?|4|5|6|8|2~1000-250?|650|750|850|700|1~No corners?|Triangle|Square|Circle|Rectangle|2",
"Place value of 7 in 7,891?|7|70|700|7,000|3~512+389?|891|901|911|801|1~900-475?|425|435|525|375|0~6x9?|52|54|56|48|1~81÷9?|7|8|9|10|2~Biggest fraction?|1/4|1/2|1/3|1/8|1~Minutes in 2 hours?|60|90|120|180|2~Area 5cm by 4cm?|9cm²|18cm²|20cm²|25cm²|2~$10-$3.75?|$6.25|$6.75|$7.25|$5.25|0~Multiple of 5?|32|41|55|63|2~3/4 of 12?|6|8|9|10|2~Grams in 1kg?|100|500|1000|10|2~45÷5?|7|8|9|10|2~123x3?|369|359|379|389|0~Right angle?|45°|90°|120°|180°|1~2.5+1.5?|3.0|4.0|4.5|5.0|1~Tuesday +3 days?|Thursday|Friday|Saturday|Sunday|1~Book $350, pay $500, change?|$100|$150|$200|$250|1~1/2+1/4?|2/4|3/4|1/4|1/2|1~Cube faces?|4|5|6|8|2",
"2345+1456?|3801|3791|3901|3711|0~5000-1234?|3766|3666|3876|4766|0~12x4?|44|46|48|52|2~96÷8?|10|11|12|14|2~Equal to 0.5?|1/4|1/2|3/4|1/5|1~Seconds in 1 min?|30|45|60|90|2~Perimeter 8cm by 3cm?|11cm|22cm|24cm|30cm|1~Heaviest?|500g|1kg|800g|2kg|3~$2.50x4?|$8|$9|$10|$12|2~7000+300+20+5?|7325|7235|7352|7532|0~Which is prime?|9|11|15|21|1~100÷10?|1|10|100|1000|1~Quarters in $2?|2|4|6|8|3~15x3?|35|40|45|50|2~Triangle 90°,45°,?|30°|45°|60°|90°|1~3.25-1.25?|1.0|2.0|2.5|3.0|1~Measures length?|Litre|Metre|Gram|Second|1~1 pen $80, 5 pens?|$300|$350|$400|$450|2~5/10 simplified?|1/2|1/4|2/3|1/5|0~Cuboid edges?|8|10|12|16|2",
"678+322?|900|1000|990|1010|1~1000-888?|112|122|212|102|0~9x7?|56|63|64|72|1~56÷7?|6|7|8|9|2~1/3 of 27?|6|7|8|9|3~Smallest fraction?|1/2|1/3|1/4|1/5|3~Feb days leap year?|28|29|30|31|1~1 litre in ml?|100|500|1000|10000|2~$15÷3?|$3|$5|$6|$4|1~Round 1456 to nearest 100|1400|1500|1460|1000|1~8x8?|56|64|72|81|1~200+200+200?|400|500|600|800|2~Quadrilateral?|Triangle|Pentagon|Square|Hexagon|2~Half past 3?|3:15|3:30|3:45|4:00|1~4.5+2.5?|6.0|7.0|7.5|8.0|1~Train 8:00 to 10:30?|1h30m|2h30m|2h|3h|1~10% of 200?|10|20|30|40|1~48 pencils, 6 per pack?|6|7|8|9|2~2/5+1/5?|1/5|2/5|3/5|4/5|2~Square pyramid vertices?|4|5|6|8|1",
"4567+2333?|6800|6900|7000|6700|1~3000-1750?|1250|1350|1150|1450|0~15x6?|80|85|90|95|2~144÷12?|10|11|12|14|2~Decimal =3/4?|0.25|0.5|0.75|0.8|2~Mm in 5cm?|5|25|50|500|2~Area square side 9cm?|18cm²|36cm²|81cm²|90cm²|2~$20-$7.50?|$12.50|$13.50|$11.50|$10.50|0~Multiple of 3 and 4?|10|12|15|18|1~1000÷25?|20|30|40|50|2~0.9+0.1?|0.10|1.0|1.1|0.9|1~Hours in 3 days?|24|48|72|96|2~Next prime after 13?|15|17|19|21|1~3 dozen?|24|30|36|48|2~Perimeter 10cm by 2cm?|12cm|20cm|24cm|22cm|2~7x11?|67|77|87|71|1~5/8-3/8?|1/8|2/8|3/8|4/8|1~Have $1000, spend $650?|$250|$350|$450|$300|1~Longest?|1m|100cm|1000mm|All same|3~25% of 80?|10|20|25|30|1"
];
let tests=raw.map(r=>r.split("~").map(q=>{let p=q.split("|");return{q:p[0],o:p.slice(1,5),a:+p[5]}}));
let ct=0,cq=0,sel=-1,ans=[[],[],[],[],[]],last=0;
let tabs=document.getElementById('tabs');
tests.forEach((t,i)=>{let b=document.createElement('button');b.className='tab'+(i==0?' active':'');b.textContent='Test '+(i+1);b.onclick=()=>{ct=i;cq=0;sel=-1;document.getElementById('res').style.display='none';document.getElementById('quiz').style.display='block';upd();show();};tabs.appendChild(b);});
function upd(){[...tabs.children].forEach((c,i)=>c.className='tab'+(i==ct?' active':''));}
function show(){let q=tests[ct][cq];document.getElementById('qh').textContent=`Test ${ct+1} - Question ${cq+1} of 20`;document.getElementById('qq').textContent=q.q;let d=document.getElementById('opts');d.innerHTML='';q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{sel=i;[...d.children].forEach((c,j)=>c.className='opt'+(j==i?' sel':''));};d.appendChild(b);});}
function nxt(){if(sel==-1){alert('Pick an answer first!');return;}ans[ct][cq]=sel;sel=-1;if(cq<19){cq++;show();}else{let s=0;tests[ct].forEach((q,i)=>{if(ans[ct][i]==q.a)s++;});last=s;document.getElementById('quiz').style.display='none';let r=document.getElementById('res');r.style.display='block';r.innerHTML=`✅ Test ${ct+1} Finished!<br>Score: ${s} / 20`;document.getElementById('ps').innerHTML=`Your score for <b>Test ${ct+1}</b> is<br><span style="font-size:32px">${s} / 20</span>`;document.getElementById('pop').classList.add('show');}}
function sendWA(){let n=document.getElementById('wn').value.replace(/[^0-9]/g,'');if(!n){alert('Type parent number first');return;}let m=`Hello! My child finished Grade 4 PEP Mathematics Test ${ct+1} on PEPLINK JA. Score: ${last} / 20`;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank');}
function closeP(){document.getElementById('pop').classList.remove('show');if(ct<4){ct++;cq=0;sel=-1;document.getElementById('res').style.display='none';document.getElementById('quiz').style.display='block';upd();show();}}
upd();show();
</script></body></html>
