let curTest=0, curQ=0, score=0, lastScore=0;
const tabs=document.getElementById('tabs'), box=document.getElementById('box');
tests.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.name;b.onclick=()=>startTest(i);tabs.appendChild(b);});
function updateTabs(){[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===curTest));}
function startTest(i){curTest=i;curQ=0;score=0;updateTabs();showQ();}
function showQ(){
 let t=tests[curTest], q=t.qs[curQ];
 box.innerHTML=`<p>📘 ${t.name} - Question ${curQ+1} of 20</p><div class="q">${q.q}</div>`+q.o.map(o=>`<button class="opt" onclick="check(this,'${o.replace(/'/g,"")}')">${o}</button>`).join('')+`<div id="fb"></div>`;
}
function check(btn, picked){
 let t=tests[curTest], q=t.qs[curQ];
 let correct = picked===q.a;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.textContent===q.a) b.classList.add('correct');});
 if(correct){score++; btn.classList.add('correct');} else btn.classList.add('wrong');
 document.getElementById('fb').innerHTML=`<div class="exp"><b>${correct?'✅ Correct!':'❌ Not quite.'}</b> ${q.e}<br><button class="next" onclick="nextQ()">${curQ===19?'See My Score →':'Next Question →'}</button></div>`;
}
function nextQ(){ if(curQ<19){curQ++; showQ();} else showResult(); }
function showResult(){
 lastScore=score;
 let saved = localStorage.getItem('momNum')||'';
 let nextBtn = curTest<4 ? `<button class="next" onclick="startTest(${curTest+1})">Next Test → ${tests[curTest+1].name}</button>` : `<p class="small">🎉 You finished all 5 tests! Great job!</p>`;
 box.innerHTML=`<div class="big">🎉 Done! ${tests[curTest].name}<br><br>Score: <b>${score} / 20</b><br><span style="font-size:14px;color:#555">This score is LOCKED - it is filled in automatically</span></div>
 <p style="margin-top:16px">Send score to Mom / anyone:</p>
 <input id="phone" placeholder="Type WhatsApp number e.g. 18761234567" value="${saved}">
 <p class="small">Type number with country code - Jamaica is 1 + 876 / 658. No spaces or -</p>
 <button class="wa" onclick="sendWA()">Send Score on WhatsApp 📲</button>
 ${nextBtn}`;
}
function sendWA(){
 let num=document.getElementById('phone').value.replace(/[^0-9]/g,'');
 if(num.length===10 && (num.startsWith('876')||num.startsWith('658'))) num='1'+num;
 if(num.length<10){alert('Please type a full WhatsApp number, e.g. 18761234567'); return;}
 localStorage.setItem('momNum', num);
 let msg=`Hi Mom, I finished ${tests[curTest].name} - Grade 4 PEP Number. My score is ${lastScore} / 20. 🎉`;
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
}
startTest(0);

</script>
