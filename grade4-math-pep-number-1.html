<style>
body{margin:0;font-family:Arial;background:#eef2ff;padding:12px}
.wrap{max-width:520px;margin:0 auto;background:#fff;padding:14px;border-radius:22px}
/* NEW HEADER LIKE YOUR PHOTO */
.header{background:#1e3a5f;color:#fff;text-align:center;padding:28px 16px;border-radius:18px}
.header h1{margin:0;font-size:26px;line-height:1.3;font-weight:900}
.header p{margin:12px 0 0 0;font-size:16px;opacity:.9;line-height:1.4}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}
.tab{padding:10px 18px;border-radius:30px;border:0;background:#e0e0e0;font-weight:700;font-size:16px;cursor:pointer}
.tab.active{background:#1e3a5f;color:#fff}
.qhead{font-size:17px;font-weight:700;margin:10px 0}
.q{font-size:22px;font-weight:800;margin:10px 0 16px 0}
.opt{display:block;width:100%;text-align:left;padding:16px;border:2px solid #ddd;border-radius:12px;margin:10px 0;background:#fff;font-size:19px;cursor:pointer}
.opt.selected{border-color:#1e3a5f;background:#e3f2fd;font-weight:700}
.btn{display:block;width:100%;padding:18px;border:0;border-radius:14px;font-size:19px;font-weight:800;color:#fff;cursor:pointer;margin-top:14px}
.blue{background:#1e3a5f}
.green{background:#25D366}
.grey{background:#888}
input{width:100%;padding:16px;border:2px solid #ddd;border-radius:12px;font-size:17px;box-sizing:border-box;margin-top:14px}
/* POPUP */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
.popup.show{display:flex}
.popbox{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:22px;text-align:center}
.popbox h2{margin:0 0 8px 0;font-size:24px}
.popbox p{color:#555;line-height:1.5}
.hide{display:none}
</style>
</head>

<div class="header">
<h1>🇯🇲 Grade 4 PEP - Mathematics<br>100 Questions - 5 Tests</h1>
<p>Test 1-5 • 20 questions each • Final score<br>recorded automatically</p>
</div>

<div class="tabs" id="tabs"></div>

<div id="quizArea">
<div class="qhead" id="qhead"></div>
<div class="q" id="question"></div>
<div id="options"></div>
<button class="btn blue" onclick="nextQ()">Next →</button>
</div>

<div id="result" class="hide" style="text-align:center;padding:20px;background:#e8f5e9;border-radius:12px;font-size:20px;font-weight:800;margin-top:14px"></div>

<a href="grade4-pep-practice.html" style="text-decoration:none"><button class="btn blue">← Back to PEP Practice Centre</button></a>
</div>

<!-- WHATSAPP POPUP - ONLY AFTER TEST FINISHES -->
<div class="popup" id="waPopup">
<div class="popbox">
<h2>🎉 Test Finished!</h2>
<p id="popScore"></p>
<p>Send this score to parent on WhatsApp?</p>
<input id="waNum" placeholder="Type parent WhatsApp number e.g. 1876...">
<button class="btn green" onclick="sendWA()">Send on WhatsApp 📲</button>
<button class="btn grey" onclick="closePopup()">Close / Next Test →</button>
</div>
</div>
