<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 5 Mock Tests</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f7}
.header{background:#1a365d;color:white;text-align:center;padding:28px 15px}.header h1{margin:0;font-size:28px}.header p{margin:8px 0 0;font-size:18px}
.wrap{padding:15px}.btn{display:block;background:#28a745;color:white;text-align:center;padding:18px;border-radius:18px;font-weight:bold;font-size:20px;margin:10px 0;text-decoration:none;cursor:pointer;border:none;width:100%}.btn.blue{background:#007bff}.back{background:#1a365d}
.card{background:white;border-radius:18px;padding:18px;margin:10px 0}.opt{display:block;width:100%;text-align:left;background:#f1f1f1;border:2px solid #ddd;border-radius:12px;padding:12px;margin:8px 0;font-size:17px;cursor:pointer}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.exp{background:#fff3cd;padding:12px;border-radius:12px;margin-top:10px;display:none}
</style></head><body>
<div class="header"><h1>🇯🇲 Grade 5 Mock Tests</h1><p>Mathematics & Language Arts • MOE Style</p></div>
<div class="wrap" id="main">
<button class="btn" onclick="showBatches('maths')">Mathematics - 10 Batches</button>
<button class="btn blue" onclick="showBatches('language')">Language Arts - 10 Batches</button>
<a class="btn back" href="grade5.html">Back to Grade 5</a>
</div>
<script>
var DATA={
maths:{title:"Mathematics",batches:[
{name:"Batch 1 - Numbers to 100,000",qs:[{q:"What is the value of 7 in 47,295?",o:["7000","700","70","7"],a:0,e:"7 is in thousands place = 7000."},{q:"Which number is 10,000 more than 45,320?",o:["55,320","45,330","35,320","55,230"],a:0,e:"45,320 + 10,000 = 55,320."},{q:"Round 68,472 to nearest thousand.",o:["68,000","69,000","68,500","70,000"],a:0,e:"472 rounds down = 68,000."},{q:"Order from smallest: 34,210 - 34,120 - 34,201",o:["34,120, 34,201, 34,210","34,210, 34,201, 34,120","34,201, 34,120, 34,210","34,120, 34,210, 34,201"],a:0,e:"Compare hundreds."},{q:"What is 50,000 + 4,000 + 300 + 20 + 6?",o:["54,326","54,236","50,436","54,362"],a:0,e:"54,326."},{q:"Which is greatest?",o:["89,999","89,909","89,099","88,999"],a:0,e:"89,999 is greatest."}]},
{name:"Batch 2 - Addition & Subtraction",qs:[{q:"34,567 + 18,945 = ?",o:["53,512","53,412","52,512","53,522"],a:0,e:"34,567 + 18,945 = 53,512."},{q:"60,000 - 27,845 = ?",o:["32,155","32,145","33,155","32,255"],a:0,e:"60,000 - 27,845 = 32,155."},{q:"A shop sold 23,450 mangoes in June and 19,875 in July. How many in all?",o:["43,325","43,225","42,325","43,335"],a:0,e:"23,450 + 19,875 = 43,325."},{q:"Difference between 45,200 and 31,675?",o:["13,525","13,425","14,525","12,525"],a:0,e:"45,200 - 31,675 = 13,525."},{q:"Estimate 48,912 + 21,308 to nearest thousand.",o:["70,000","69,000","71,000","70,500"],a:0,e:"49,000 + 21,000 = 70,000."},{q:"What number + 15,750 = 40,000?",o:["24,250","24,350","25,250","24,150"],a:0,e:"40,000 - 15,750 = 24,250."}]},
{name:"Batch 3 - Multiplication & Division",qs:[{q:"245 x 12 = ?",o:["2,940","2,840","2,950","2,440"],a:0,e:"245 x 12 = 2,940."},{q:"What is 1,248 / 12?",o:["104","102","114","94"],a:0,e:"1,248 / 12 = 104."},{q:"A box holds 36 books. How many books in 28 boxes?",o:["1,008","1,018","998","1,108"],a:0,e:"36 x 28 = 1,008."},{q:"5,640 / 15 = ?",o:["376","366","386","396"],a:0,e:"5,640 / 15 = 376."},{q:"Which is a multiple of 9?",o:["4,527","4,528","4,530","4,525"],a:0,e:"4+5+2+7=18, divisible by 9."},{q:"A farmer packs 3,600 oranges in bags of 24. How many bags?",o:["150","140","160","120"],a:0,e:"3,600 / 24 = 150."}]},
{name:"Batch 4 - Decimals & Money",qs:[{q:"What is 3.45 + 2.78?",o:["6.23","6.13","6.33","5.23"],a:0,e:"3.45 + 2.78 = 6.23."},{q:"10.50 - 4.75 = ?",o:["5.75","5.85","6.75","5.65"],a:0,e:"10.50 - 4.75 = 5.75."},{q:"Which decimal is greatest?",o:["0.85","0.805","0.8","0.58"],a:0,e:"0.85 is greatest."},{q:"A shirt costs $2,450.50 and pants $1,875.25. Total?",o:["$4,325.75","$4,225.75","$4,325.25","$4,425.75"],a:0,e:"2,450.50 + 1,875.25 = 4,325.75."},{q:"What is 0.6 x 10?",o:["6","0.06","60","0.6"],a:0,e:"0.6 x 10 = 6."},{q:"Maria pays $5,000 for items costing $3,275. Change?",o:["$1,725","$1,625","$1,825","$1,775"],a:0,e:"5,000 - 3,275 = 1,725."}]},
{name:"Batch 5 - Fractions",qs:[{q:"Which fraction is equivalent to 3/4?",o:["6/8","3/8","4/3","2/4"],a:0,e:"3/4 = 6/8."},{q:"What is 2/5 + 1/5?",o:["3/5","3/10","2/10","1/5"],a:0,e:"2/5 + 1/5 = 3/5."},{q:"What is 5/6 - 1/6?",o:["4/6","5/6","6/6","4/12"],a:0,e:"5/6 - 1/6 = 4/6."},{q:"Which is largest?",o:["5/6","1/2","1/3","1/4"],a:0,e:"5/6 is largest."},{q:"What is 3/4 of 28?",o:["21","20","22","24"],a:0,e:"28 / 4 x 3 = 21."},{q:"Convert 7/2 to mixed number.",o:["3 1/2","3 1/4","2 1/2","7 1/2"],a:0,e:"7/2 = 3 1/2."}]},
{name:"Batch 6 - Measurement & Perimeter / Area",qs:[{q:"Perimeter of rectangle 12 cm by 8 cm?",o:["40 cm","96 cm","20 cm","32 cm"],a:0,e:"2 x (12+8) = 40."},{q:"Area of rectangle 15 m by 9 m?",o:["135 sq m","48 sq m","24 sq m","120 sq m"],a:0,e:"15 x 9 = 135."},{q:"How many cm in 4.5 m?",o:["450 cm","45 cm","4500 cm","405 cm"],a:0,e:"4.5 x 100 = 450."},{q:"How many ml in 3.5 litres?",o:["3,500 ml","350 ml","35 ml","3,050 ml"],a:0,e:"3.5 x 1000 = 3,500."},{q:"A square has perimeter 48 cm. Side length?",o:["12 cm","16 cm","10 cm","24 cm"],a:0,e:"48 / 4 = 12."},{q:"Which is heaviest?",o:["2.5 kg","2,400 g","2 kg","1,900 g"],a:0,e:"2.5 kg = 2,500 g."}]},
{name:"Batch 7 - Geometry & Angles",qs:[{q:"How many degrees in a right angle?",o:["90","180","45","360"],a:0,e:"Right angle = 90."},{q:"Which angle is obtuse?",o:["120 degrees","90 degrees","45 degrees","30 degrees"],a:0,e:"Obtuse > 90 and < 180."},{q:"How many sides does a hexagon have?",o:["6","5","8","7"],a:0,e:"Hexa = 6."},{q:"Which shape has 2 pairs of parallel sides?",o:["Parallelogram","Triangle","Circle","Pentagon"],a:0,e:"Parallelogram."},{q:"Sum of angles in a triangle?",o:["180 degrees","90 degrees","360 degrees","120 degrees"],a:0,e:"Triangle = 180."},{q:"How many vertices does a cuboid have?",o:["8","6","12","10"],a:0,e:"Cuboid has 8 vertices."}]},
{name:"Batch 8 - Time & Data",qs:[{q:"Bus leaves 9:45 a.m. arrives 1:15 p.m. How long?",o:["3 hrs 30 min","3 hrs","4 hrs 30 min","2 hrs 30 min"],a:0,e:"9:45 to 1:15 = 3 hrs 30 min."},{q:"How many minutes in 3 hrs 15 min?",o:["195","180","215","165"],a:0,e:"180 + 15 = 195."},{q:"Data: 12, 15, 18, 15, 20. Mode?",o:["15","12","18","20"],a:0,e:"15 appears twice."},{q:"Mean of 10, 20, 30, 40?",o:["25","20","30","100"],a:0,e:"100 / 4 = 25."},{q:"Range of 8, 14, 22, 30?",o:["22","30","8","14"],a:0,e:"30 - 8 = 22."},{q:"If today is Friday, what day in 10 days?",o:["Monday","Tuesday","Sunday","Saturday"],a:0,e:"Fri + 10 = Mon."}]},
{name:"Batch 9 - Percentages & Ratio",qs:[{q:"What is 50% of 240?",o:["120","100","140","60"],a:0,e:"Half of 240 = 120."},{q:"What is 25% of 400?",o:["100","50","200","75"],a:0,e:"Quarter of 400 = 100."},{q:"Express 1/2 as percent.",o:["50%","25%","75%","20%"],a:0,e:"1/2 = 50%."},{q:"Ratio 2:3. If first is 10, second is?",o:["15","12","20","5"],a:0,e:"10 / 2 x 3 = 15."},{q:"In a class, 12 of 30 students wear glasses. What percent?",o:["40%","30%","12%","60%"],a:0,e:"12 / 30 = 40%."},{q:"A shirt was $2,000, now 10% off. New price?",o:["$1,800","$1,900","$1,700","$2,100"],a:0,e:"2,000 - 200 = 1,800."}]},
{name:"Batch 10 - Mixed Review Maths",qs:[{q:"A school has 1,250 students. 3/5 are girls. How many girls?",o:["750","500","700","800"],a:0,e:"1,250 / 5 x 3 = 750."},{q:"What is 4.75 + 2.25 - 1.5?",o:["5.5","5.0","6.0","4.5"],a:0,e:"4.75+2.25=7, 7-1.5=5.5."},{q:"Rectangle 20 cm long, area 240 sq cm. Width?",o:["12 cm","10 cm","14 cm","20 cm"],a:0,e:"240 / 20 = 12."},{q:"Next in pattern: 3, 9, 27, 81, ?",o:["243","108","162","81"],a:0,e:"Multiply by 3."},{q:"5 books cost $3,750. 1 book?",o:["$750","$700","$800","$650"],a:0,e:"3,750 / 5 = 750."},{q:"Jada is 11. Her brother is 3 years older and twice her age in 5 years? Brother now?",o:["14","16","15","13"],a:0,e:"11 + 3 = 14."}]}
]},
language:{title:"Language Arts",batches:[
{name:"Batch 1 - Comprehension 1",qs:[{q:"The river was calm. Fish swam slowly. Birds sang. What was the river like?",o:["Calm","Rough","Noisy","Dry"],a:0,e:"Passage says calm."},{q:"What did the fish do?",o:["Swam slowly","Jumped high","Sang","Flew"],a:0,e:"Fish swam slowly."},{q:"What did the birds do?",o:["Sang","Swam","Ran","Slept"],a:0,e:"Birds sang."},{q:"What is the main idea?",o:["A peaceful morning by the river","A storm","A football game","A busy market"],a:0,e:"Calm, peaceful morning."},{q:"Which word means same as calm?",o:["Peaceful","Rough","Loud","Fast"],a:0,e:"Calm = peaceful."},{q:"What can you infer about the place?",o:["It was quiet and beautiful","It was crowded","It was dangerous","It was dirty"],a:0,e:"Calm, birds, fish = quiet."}]},
{name:"Batch 2 - Grammar",qs:[{q:"Which is a pronoun?",o:["They","Table","Run","Happy"],a:0,e:"They replaces names."},{q:"The teacher ___ the books on the desk.",o:["placed","place","placing","places"],a:0,e:"Past - placed."},{q:"Choose correct: Neither Jada nor Tom ___ late.",o:["was","were","are","have"],a:0,e:"Neither + nor = singular."},{q:"Which is an adjective?",o:["Beautiful","Run","Quickly","Sing"],a:0,e:"Beautiful describes."},{q:"Which is an adverb?",o:["Quickly","Quick","Happy","Dog"],a:0,e:"Quickly tells how."},{q:"Plural of church is?",o:["Churches","Churchs","Churches","Churches"],a:0,e:"Church to churches."}]},
{name:"Batch 3 - Vocabulary",qs:[{q:"Meaning of generous?",o:["Willing to give","Selfish","Angry","Lazy"],a:0,e:"Generous = giving."},{q:"Synonym for brave?",o:["Courageous","Afraid","Weak","Sad"],a:0,e:"Brave = courageous."},{q:"Antonym for honest?",o:["Dishonest","Kind","Truthful","Brave"],a:0,e:"Honest opposite dishonest."},{q:"Meaning of exhausted?",o:["Very tired","Very happy","Very hungry","Very angry"],a:0,e:"Exhausted = very tired."},{q:"Synonym for ancient?",o:["Very old","Very new","Very small","Very fast"],a:0,e:"Ancient = very old."},{q:"Antonym for expand?",o:["Shrink","Grow","Increase","Stretch"],a:0,e:"Expand opposite shrink."}]},
{name:"Batch 4 - Punctuation & Capitalization",qs:[{q:"Choose correct:",o:["Did you visit Montego Bay?","did you visit montego bay?","Did you visit montego bay.","Did you visit Montego Bay."],a:0,e:"Question + capitals."},{q:"Which needs apostrophe?",o:["It is Jada's book.","It is Jadas book.","It is jadas book","It is Jada book."],a:0,e:"Jada's shows belonging."},{q:"Where does comma go? After school we went home ate dinner and studied.",o:["After school, we went home, ate dinner, and studied.","After school we went home ate dinner and studied.","After, school we went home","No commas"],a:0,e:"Commas separate list."},{q:"Choose correct:",o:["Wow! That was amazing.","Wow that was amazing.","wow! that was amazing","Wow! that was amazing."],a:0,e:"Wow! + capital."},{q:"Which is direct speech correct?",o:["She said, Come here.","She said Come here.","She said, Come here.","She said come here."],a:0,e:"Direct speech needs quotes."},{q:"Which title needs capital?",o:["The Lion King","the lion king","The lion king","the Lion King"],a:0,e:"Titles use capitals."}]},
{name:"Batch 5 - Spelling",qs:[{q:"Which is correct?",o:["Necessary","Necesary","Neccessary","Necessarry"],a:0,e:"Necessary is correct."},{q:"Which is correct?",o:["Environment","Enviroment","Environmet","Enviornment"],a:0,e:"Environment is correct."},{q:"Which is correct?",o:["Government","Goverment","Governmant","Govenment"],a:0,e:"Government is correct."},{q:"Which is correct?",o:["Occasionally","Occassionally","Occasionaly","Ocassionally"],a:0,e:"Occasionally is correct."},{q:"Which is correct?",o:["Separate","Seperate","Separete","Seperat"],a:0,e:"Separate is correct."},{q:"Which is correct?",o:["Believe","Beleive","Belive","Beleeve"],a:0,e:"Believe is correct."}]},
{name:"Batch 6 - Synonyms & Antonyms",qs:[{q:"Synonym for wealthy?",o:["Rich","Poor","Lazy","Weak"],a:0,e:"Wealthy = rich."},{q:"Antonym for victory?",o:["Defeat","Win","Success","Prize"],a:0,e:"Victory opposite defeat."},{q:"Synonym for enormous?",o:["Huge","Tiny","Small","Little"],a:0,e:"Enormous = huge."},{q:"Antonym for include?",o:["Exclude","Add","Join","Contain"],a:0,e:"Include opposite exclude."},{q:"Synonym for rapid?",o:["Fast","Slow","Late","Lazy"],a:0,e:"Rapid = fast."},{q:"Antonym for permanent?",o:["Temporary","Long","Strong","Forever"],a:0,e:"Permanent opposite temporary."}]},
{name:"Batch 7 - Tenses & Verbs",qs:[{q:"By tomorrow, she ___ finished her work.",o:["will have","has","have","had"],a:0,e:"Future perfect = will have."},{q:"They ___ in Kingston since 2019.",o:["have lived","live","lived","living"],a:0,e:"Since = have lived."},{q:"She ___ to school when it rained.",o:["was walking","walk","walks","walking"],a:0,e:"Past continuous."},{q:"Past tense of teach?",o:["Taught","Teached","Teaching","Teach"],a:0,e:"Teach to taught."},{q:"Choose correct: The boys ___ playing now.",o:["are","is","was","were"],a:0,e:"Boys = are."},{q:"Tomorrow, we ___ the museum.",o:["will visit","visited","visiting","visits"],a:0,e:"Tomorrow = will visit."}]},
{name:"Batch 8 - Sentences & Paragraphs",qs:[{q:"Which is a compound sentence?",o:["I was tired, so I rested.","I was tired.","The tired boy.","Resting boy."],a:0,e:"Two ideas joined by so."},{q:"Which is a complex sentence?",o:["Although it rained, we played.","We played.","It rained.","We played football."],a:0,e:"Although makes it complex."},{q:"Best topic sentence for paragraph about mangoes?",o:["Mangoes are Jamaica's favourite fruit.","I like red.","The dog barked.","School is fun."],a:0,e:"Topic must be about mangoes."},{q:"Which is a fragment?",o:["Running down the road.","She ran down the road.","She is running.","They ran."],a:0,e:"No subject + verb complete."},{q:"Which uses correct conjunction?",o:["She stayed home because she was sick.","She stayed home and she was sick.","She stayed home but she was sick.","She stayed home or she was sick."],a:0,e:"Because shows reason."},{q:"How many sentences? The sun rose. Birds sang. Children woke up.",o:["3","1","2","4"],a:0,e:"3 full stops."}]},
{name:"Batch 9 - Comprehension 2",qs:[{q:"Farmers protect soil by planting trees. Trees stop erosion. Why plant trees?",o:["To stop erosion","To cut wood","To sell trees","To make shade only"],a:0,e:"Trees stop erosion."},{q:"What is erosion?",o:["Washing away of soil","Planting crops","Watering plants","Cutting trees"],a:0,e:"Erosion = soil washing away."},{q:"What do farmers protect?",o:["Soil","Houses","Cars","Schools"],a:0,e:"Farmers protect soil."},{q:"What is the main idea?",o:["Trees help protect soil","Trees are tall","Farmers sell trees","Soil is brown"],a:0,e:"Trees protect soil."},{q:"Which word means same as protect?",o:["Keep safe","Harm","Destroy","Ignore"],a:0,e:"Protect = keep safe."},{q:"What can you conclude?",o:["Planting trees is good for farming","Trees are bad","Farming is easy","Soil is not important"],a:0,e:"Trees help farming."}]},
{name:"Batch 10 - Mixed Review Language Arts",qs:[{q:"Which is a metaphor?",o:["Life is a journey.","Life is like a journey.","He runs fast.","She sings."],a:0,e:"Metaphor says is, not like."},{q:"Which is a simile?",o:["As brave as a lion.","Brave lion.","He is brave.","Lion is brave."],a:0,e:"Simile uses as."},{q:"Choose correct: The team ___ won the match.",o:["has","have","are","were"],a:0,e:"Team = singular has."},{q:"Which is spelled correctly?",o:["Rhythm","Rythm","Rhythem","Rithm"],a:0,e:"Rhythm is correct."},{q:"Best ending for story about kindness?",o:["She learned kindness changes lives.","She went home.","It was Monday.","The dog barked."],a:0,e:"Ending must match theme."},{q:"What is the moral of a story about a boy who lied?",o:["Always tell the truth","Lying is fun","Friends are good","School is fun"],a:0,e:"Moral = tell truth."}]}
]}
};
function showHome(){location.reload();}
function showBatches(sub){
var main=document.getElementById("main");main.innerHTML="";
var h=document.createElement("h2");h.style.textAlign="center";h.textContent=DATA[sub].title;main.appendChild(h);
DATA[sub].batches.forEach(function(b,i){
var btn=document.createElement("button");btn.className="btn";btn.textContent=b.name;
btn.onclick=function(){openBatch(sub,i)};main.appendChild(btn);});
var back=document.createElement("button");back.className="btn back";back.textContent="Back to Subjects";back.onclick=showHome;main.appendChild(back);window.scrollTo(0,0);
}
function openBatch(sub,i){
var main=document.getElementById("main");main.innerHTML="";
var b=DATA[sub].batches[i];
var h=document.createElement("h2");h.style.textAlign="center";h.textContent=b.name;main.appendChild(h);
b.qs.forEach(function(q,qi){
var card=document.createElement("div");card.className="card";
var t=document.createElement("b");t.textContent="Q"+(qi+1)+". "+q.q;card.appendChild(t);
q.o.forEach(function(opt,oi){
var ob=document.createElement("button");ob.className="opt";ob.textContent=opt;
ob.onclick=function(){var btns=card.querySelectorAll(".opt");btns.forEach(function(x){x.disabled=true});ob.className="opt "+(oi===q.a?"correct":"wrong");exp.style.display="block"};card.appendChild(ob);});
var exp=document.createElement("div");exp.className="exp";exp.textContent=q.e;card.appendChild(exp);
main.appendChild(card);});
var back=document.createElement("button");back.className="btn back";back.textContent="Back to Batches";back.onclick=function(){showBatches(sub)};main.appendChild(back);window.scrollTo(0,0);
}
</script></body></html>
