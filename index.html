<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPLINK JA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#d9d9d9;font-family:Arial;display:flex;justify-content:center;padding:10px}
.card{width:100%;max-width:420px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.top{background:#143a70;padding:20px 12px;text-align:center}
.top h1{color:#fff;font-size:22px;font-weight:800}
.top p{color:#fff;font-size:13px;margin-top:6px}
.hero{width:100%;background:#000}
.hero img{width:100%;height:380px;object-fit:cover;object-position:top;display:block}
.mid{background:#0a0a0a;color:#fff;padding:20px 18px}
.mid ul{list-style:disc;padding-left:18px}
.mid li{font-size:14px;margin-bottom:12px;line-height:1.35}
.choose{background:#fff;padding:24px 14px 28px;text-align:center}
.choose h2{color:#12315f;font-size:22px;font-weight:800;margin-bottom:18px}
.btns{display:flex;gap:10px;justify-content:center}
.btns a{background:#1862d6;color:#fff;text-decoration:none;padding:15px 0;width:110px;border-radius:14px;font-weight:800;font-size:16px;display:block;text-align:center}
.foot{background:#c7c7c7;text-align:center;padding:13px;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="top">
<h1>Welcome To PEPLINK JA</h1>
<p>All PEP Preparation on One Platform</p>
</div>

<div class="hero">
<img src="hero.jpg" alt="PEP Students">
</div>

<div class="mid">
<ul>
<li>Aligned with Jamaica's National PEP Curriculum</li>
<li>Organized Learning for Grades 4-6</li>
<li>Comprehensive PEP Preparation - All in One Platform</li>
</ul>
</div>

<div class="choose">
<h2>Choose your Grade</h2>
<div class="btns">
<a href="Grade4/">GRADE 4</a>
<a href="Grade5/">GRADE 5</a>
<a href="Grade6/">GRADE 6</a>
</div>
</div>

<div class="foot">Educational Technology for Jamaica</div>
</div>
</body>
</html>
