    font-size: 13.5px;
    font-weight: 700;
    color: #0A2A5E;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px;
    color: #0A2A5E;
    background: #f8fafc;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #1E6FDB;
    background: #fff;
  }
  .lock-note {
    background: #FFFBEA;
    border: 1.5px solid #F2B705;
    border-radius: 12px;
    padding: 12px;
    margin-top: 16px;
    font-size: 12.5px;
    color: #4a3b00;
    line-height: 1.45;
  }
  .login-btn {
    width: 100%;
    background: #F2B705;

    border-radius: 14px;
    font-size: 18px;
    font-weight: 800;
    margin-top: 18px;
    cursor: pointer;
  }
  .wa-help {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 13.5px;
    font-weight: 700;
    color: #166534;
    text-decoration: none;
  }
  .back-btn {
    display: block;
    text-align: center;
    background: #e2e8f0;
    color: #1e293b;
    text-decoration: none;
    padding: 13px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    margin-top: 14px;
  }
</style>
</head>

    <h1>Welcome Back to PEPLink JA</h1>

        <option value="grade5.html">Grade 5</option>

      <label for="accessCode">Term 1 Access Code</label>
      <input type="text" id="accessCode" placeholder="Enter your PEPLink JA Term Code" required>

      <div class="lock-note">
        🔒 <b>1-Child Device Protection:</b> Each $5,000 JMD term pass is locked to one student and this device.
      </div>

      <button type="submit" class="login-btn">Log In to My Grade Hub →</button>
    </form>

    <a href="https://wa.me." target="_blank" class="wa-help">
      Need a Term 1 Access Code? Message us on WhatsApp →
    </a>

    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>
</div>
