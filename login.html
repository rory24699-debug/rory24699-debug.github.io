<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Code - PEPLink JA</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0A2A5E;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  }
  .header {
    background: #143a70;
    color: #fff;
    text-align: center;
    padding: 26px 18px;
  }
  .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
  .header p { margin: 6px 0 0; font-size: 14px; color: #D6E4FF; }
  .body { padding: 24px 18px; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: #0A2A5E;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    color: #0A2A5E;
    background: #f8fafc;
    text-align: center;
    letter-spacing: 1px;
  }
  input:focus {
    outline: none;
    border-color: #1E6FDB;
    background: #fff;
  }
  .start-btn {
    width: 100%;
    background: #F2B705;
    color: #0A2A5E;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 800;
    margin-top: 18px;
    cursor: pointer;
  }
  .expired-box {
    display: none;
    background: #FEF2F2;
    border: 2px solid #DC2626;
    border-radius: 12px;
    padding: 14px;
    margin-top: 16px;
    text-align: center;
    color: #7F1D1D;
    font-size: 14px;
  }
  .wa-renew {
    display: inline-block;
    margin-top: 10px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
  }
  .back-btn {
    display: block;
    text-align: center;
    background: #e2e8f0;
    color: #1e293b;
    text-decoration: none;
    padding: 13px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    margin-top: 14px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>PEPLink JA</h1>
    <p>Enter Your Term Access Code to Start</p>
  </div>

  <div class="body">
    <form onsubmit="unlockApp(event)">
      <label for="accessCode">Term Access Code</label>
      <input type="text" id="accessCode" placeholder="e.g. PEP-T1-8492" required>

      <button type="submit" class="start-btn">ENTER &amp; START GRADE →</button>
    </form>

    <!-- Only shows if code is expired -->
    <div id="expiredBox" class="expired-box">
      <b>Your Term Access Has Expired.</b><br>
      Message PEPLink JA on WhatsApp to renew for the new term.
      <br>
      <a href="https://wa.me." target="_blank" class="wa-renew">Renew on WhatsApp →</a>
    </div>

    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>
</div>

<script>
  // Auto-fill saved code on this device
  window.onload = function() {
    const saved = localStorage.getItem('pep_access_code');
    if (saved) document.getElementById('accessCode').value = saved;
  };

  function unlockApp(e) {
    e.preventDefault();
    const code = document.getElementById('accessCode').value.trim().toUpperCase();

    // Example expired code trigger (replace with your real term expiration date/code check)
    if (code === 'EXPIRED') {
      document.getElementById('expiredBox').style.display = 'block';
      return;
    }

    if (code.length < 4) {
      alert('Please enter a valid Term Access Code.');
      return;
    }

    localStorage.setItem('pep_access_code', code);
    window.location.href = 'menu.html';
  }
</script>
</body>
</html>
