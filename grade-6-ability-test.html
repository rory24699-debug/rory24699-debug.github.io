<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 6 Ability Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f7}
.header{background:#1a365d;color:white;text-align:center;padding:28px 15px}.header h1{margin:0;font-size:28px}.header p{margin:8px 0 0;font-size:18px}
.wrap{padding:15px}.btn{display:block;background:#28a745;color:white;text-align:center;padding:18px;border-radius:18px;font-weight:bold;font-size:20px;margin:10px 0;text-decoration:none;cursor:pointer;border:none;width:100%}.btn.blue{background:#007bff}.btn.orange{background:#ff7a00}.btn.purple{background:#6f42c1}.back{background:#1a365d}
.card{background:white;border-radius:18px;padding:18px;margin:10px 0}.opt{display:block;width:100%;text-align:left;background:#f1f1f1;border:2px solid #ddd;border-radius:12px;padding:12px;margin:8px 0;font-size:17px;cursor:pointer}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.exp{background:#fff3cd;padding:12px;border-radius:12px;margin-top:10px;display:none}
</style></head><body>
<div class="header"><h1>🇯🇲 Grade 6 Ability Test</h1><p>PEP Style • Verbal • Quantitative • Non-Verbal</p></div>
<div class="wrap" id="main">
<button class="btn" onclick="showBatches('verbal')">Verbal Reasoning - 5 Batches</button>
<button class="btn blue" onclick="showBatches('quant')">Quantitative Reasoning - 5 Batches</button>
<button class="btn orange" onclick="showBatches('nonverbal')">Non-Verbal / Spatial - 5 Batches</button>
<button class="btn purple" onclick="showBatches('mixed')">Mixed Ability - 5 Batches</button>
<a class="btn back" href="grade6.html">Back to Grade 6</a>
</div>
<script>
var DATA={
verbal:{title:"Verbal Reasoning",batches:[
{name:"Batch 1 - Analogies",qs:[{q:"Book is to Read as Pencil is to ?",o:["Write","Draw","Paper","School"],a:0,e:"Book used to read, pencil used to write."},{q:"Bird is to Nest as Bee is to ?",o:["Hive","Tree","Honey","Flower"],a:0,e:"Bee lives in hive."},{q:"Hot is to Cold as Up is to ?",o:["Down","High","Sky","Jump"],a:0,e:"Opposites."},{q:"Doctor is to Hospital as Teacher is to ?",o:["School","Book","Student","Class"],a:0,e:"Doctor works in hospital, teacher in school."},{q:"Wheel is to Car as Wing is to ?",o:["Plane","Bird","Fly","Air"],a:0,e:"Wing part of plane."},{q:"Happy is to Joyful as Sad is to ?",o:["Unhappy","Angry","Tired","Calm"],a:0,e:"Sad = unhappy."}]},
{name:"Batch 2 - Odd One Out",qs:[{q:"Which is different?",o:["Mango","Banana","Potato","Orange"],a:2,e:"Potato is vegetable, others fruit."},{q:"Which is different?",o:["Run","Jump","Swim","Happy"],a:3,e:"Happy is not action."},{q:"Which is different?",o:["Kingston","Montego Bay","Spanish Town","Jamaica"],a:3,e:"Jamaica is country, others towns."},{q:"Which is different?",o:["Pen","Pencil","Ruler","Chair"],a:3,e:"Chair is furniture."},{q:"Which is different?",o:["Square","Circle","Triangle","Rectangle"],a:1,e:"Circle has no corners."},{q:"Which is different?",o:["Brave","Courageous","Fearless","Afraid"],a:3,e:"Afraid opposite others."}]},
{name:"Batch 3 - Word Relationships",qs:[{q:"If CAT = 312, what is DOG?",o:["465","456","415","564"],a:0,e:"C=3 A=1 T=20? No - pattern A=1 B=2... D=4 O=15 G=7 -> use simple: CAT code: C=3 A=1 T=20 - Not. Use: D=4 O=15 G=7 = 415? Wait - In this test: CAT 3-1-20, DOG 4-15-7 = 415. Correct is 415."},{q:"Which word means same as BEGIN?",o:["Start","End","Stop","Finish"],a:0,e:"Begin = start."},{q:"Which word means opposite of GENEROUS?",o:["Selfish","Kind","Giving","Helpful"],a:0,e:"Generous opposite selfish."},{q:"Complete: Brave, Braver, ?",o:["Bravest","Braveest","More brave","Most brave"],a:0,e:"Brave, braver, bravest."},{q:"Which is a synonym for ANCIENT?",o:["Old","New","Modern","Young"],a:0,e:"Ancient = old."},{q:"Which word does NOT belong with: Fast, Quick, Rapid, Slow?",o:["Slow","Fast","Quick","Rapid"],a:0,e:"Slow is opposite."}]},
{name:"Batch 4 - Logic Words",qs:[{q:"All dogs are animals. Rex is a dog. Therefore Rex is ?",o:["An animal","A cat","A bird","A fish"],a:0,e:"If all dogs are animals, Rex is animal."},{q:"If today is Monday, yesterday was ?",o:["Sunday","Tuesday","Saturday","Friday"],a:0,e:"Day before Monday = Sunday."},{q:"Jada is taller than Mia. Mia is taller than Sara. Who is tallest?",o:["Jada","Mia","Sara","Cannot tell"],a:0,e:"Jada > Mia > Sara."},{q:"If all red pens are in box, and pen is not in box, pen is ?",o:["Not red","Red","Blue","Black"],a:0,e:"Not in box = not red."},{q:"Tom is older than Sam. Sam is older than Ann. Who is youngest?",o:["Ann","Sam","Tom","Same"],a:0,e:"Ann is youngest."},{q:"If 2 is to 4 as 3 is to ?",o:["6","5","9","7"],a:0,e:"Double: 3 x 2 = 6."}]},
{name:"Batch 5 - Comprehension Logic",qs:[{q:"Passage: Farmers plant trees to stop soil washing away. What is the reason?",o:["To stop erosion","To sell trees","To make shade","To get fruit"],a:0,e:"Trees stop erosion."},{q:"Passage: Maria studies every night. She got top marks. Why?",o:["She studies hard","She is lucky","She is tall","She is funny"],a:0,e:"Studying leads to top marks."},{q:"Which sentence is true?",o:["Water helps plants grow","Water harms plants","Plants hate water","Plants eat water"],a:0,e:"Water helps grow."},{q:"If you save $100 each week for 5 weeks, you have ?",o:["$500","$400","$600","$100"],a:0,e:"100 x 5 = 500."},{q:"Best conclusion: Children who read daily improve vocabulary.",o:["Reading helps vocabulary","Reading is boring","Children hate books","Books are heavy"],a:0,e:"Reading improves vocab."},{q:"Which is a fact?",o:["Jamaica is an island","Jamaica is the best","Jamaica is beautiful","Jamaica is fun"],a:0,e:"Fact can be proven."}]}
]},
quant:{title:"Quantitative Reasoning",batches:[
{name:"Batch 1 - Number Patterns",qs:[{q:"Next: 2, 6, 18, 54, ?",o:["162","72","108","81"],a:0,e:"Multiply by 3."},{q:"Next: 100, 90, 81, 73, ?",o:["66","65","64","70"],a:0,e:"Subtract 10, 9, 8, 7 = 66."},{q:"Next: 1, 4, 9, 16, ?",o:["25","20","24","36"],a:0,e:"Square numbers."},{q:"What number comes before 1000?",o:["999","1001","990","100"],a:0,e:"1000 - 1 = 999."},{q:"Which is missing? 5, 10, ?, 20, 25",o:["15","12","18","14"],a:0,e:"Add 5."},{q:"If pattern is +7: 14, 21, 28, ?",o:["35","32","34","36"],a:0,e:"28 + 7 = 35."}]},
{name:"Batch 2 - Reasoning with Numbers",qs:[{q:"I think of a number, double it, add 6 = 20. Number?",o:["7","6","8","10"],a:0,e:"(20-6)/2 = 7."},{q:"A number is 3 more than 12. Number?",o:["15","9","36","12"],a:0,e:"12 + 3 = 15."},{q:"Half of 84 is ?",o:["42","40","44","38"],a:0,e:"84 / 2 = 42."},{q:"What is 1/4 of 100 + 1/2 of 100?",o:["75","50","25","100"],a:0,e:"25 + 50 = 75."},{q:"If 5 pens cost $500, 1 pen?",o:["$100","$50","$150","$200"],a:0,e:"500 / 5 = 100."},{q:"Which is larger: 3/4 or 2/3?",o:["3/4","2/3","Equal","Cannot tell"],a:0,e:"3/4 = 0.75, 2/3 = 0.66."}]},
{name:"Batch 3 - Word Problems",qs:[{q:"A bus carries 48 students. 5 buses carry ?",o:["240","200","230","250"],a:0,e:"48 x 5 = 240."},{q:"Sara has 3 bags with 24 marbles each. Total?",o:["72","60","70","80"],a:0,e:"24 x 3 = 72."},{q:"A rope 12 m cut into 4 equal parts. Each?",o:["3 m","4 m","2 m","6 m"],a:0,e:"12 / 4 = 3."},{q:"If 1 kg = 1000 g, 2.5 kg = ?",o:["2500 g","250 g","25000 g","2050 g"],a:0,e:"2.5 x 1000 = 2500."},{q:"Movie 2 hrs 15 min starts 3:00 p.m. Ends?",o:["5:15 p.m.","5:00 p.m.","4:15 p.m.","5:30 p.m."],a:0,e:"3:00 + 2:15 = 5:15."},{q:"A shop sells 120 mangoes in 3 days equally. Per day?",o:["40","30","50","60"],a:0,e:"120 / 3 = 40."}]},
{name:"Batch 4 - Shapes & Logic",qs:[{q:"How many triangles in a square divided by both diagonals?",o:["4","2","6","8"],a:0,e:"Diagonals make 4 triangles."},{q:"If a cube has 6 faces, 2 cubes stuck together have ?",o:["10 faces","12 faces","11 faces","6 faces"],a:0,e:"6+6-2 hidden = 10."},{q:"Which number is prime?",o:["19","21","25","27"],a:0,e:"19 is prime."},{q:"What is 10% of 500?",o:["50","100","25","75"],a:0,e:"500 x 0.1 = 50."},{q:"If area is 36 and length 9, width?",o:["4","6","5","3"],a:0,e:"36 / 9 = 4."},{q:"Next shape: Circle, Square, Circle, Square, ?",o:["Circle","Triangle","Rectangle","Star"],a:0,e:"Pattern alternates."}]},
{name:"Batch 5 - Advanced Reasoning",qs:[{q:"If x + 9 = 20, x = ?",o:["11","10","12","9"],a:0,e:"20 - 9 = 11."},{q:"If 4y = 36, y = ?",o:["9","8","10","12"],a:0,e:"36 / 4 = 9."},{q:"A number + itself + itself = 30. Number?",o:["10","15","5","20"],a:0,e:"30 / 3 = 10."},{q:"If 1 pencil = $50, 1 book = 3 pencils. Book = ?",o:["$150","$100","$200","$50"],a:0,e:"50 x 3 = 150."},{q:"Which is smallest: 0.5, 0.05, 0.55, 0.005?",o:["0.005","0.05","0.5","0.55"],a:0,e:"0.005 is smallest."},{q:"If today is Friday, 20 days from now is ?",o:["Thursday","Friday","Wednesday","Monday"],a:0,e:"20 mod 7 = 6, Fri + 6 = Thu."}]}
]},
nonverbal:{title:"Non-Verbal / Spatial",batches:[
{name:"Batch 1 - Patterns",qs:[{q:"Pattern: ▲ ● ▲ ● ▲ ?",o:["●","▲","■","★"],a:0,e:"Alternates ▲ ●."},{q:"Pattern: ★ ★ ☆ ★ ★ ☆ ?",o:["★","☆","●","▲"],a:0,e:"Pattern ★ ★ ☆ repeats."},{q:"Which comes next? 1 dot, 2 dots, 3 dots, ?",o:["4 dots","5 dots","2 dots","1 dot"],a:0,e:"Add 1 each time."},{q:"Pattern: Red, Blue, Red, Blue, ?",o:["Red","Blue","Green","Yellow"],a:0,e:"Alternates."},{q:"Which is odd? ▲ ▲ ▲ ●",o:["●","▲","▲","▲"],a:0,e:"● different shape."},{q:"Pattern: Small, Big, Small, Big, ?",o:["Small","Big","Medium","Tiny"],a:0,e:"Alternates."}]},
{name:"Batch 2 - Mirror & Rotation",qs:[{q:"If arrow points up, rotate 90° right, points ?",o:["Right","Left","Down","Up"],a:0,e:"Up turned right = Right."},{q:"Mirror image of B is ?",o:["Reversed B","Same B","Upside down B","Small B"],a:0,e:"Mirror reverses."},{q:"Which shape has most sides?",o:["Hexagon","Triangle","Square","Pentagon"],a:0,e:"Hexagon 6 sides."},{q:"If you fold a square in half, you get ?",o:["Rectangle","Triangle","Circle","Pentagon"],a:0,e:"Fold gives rectangle or triangle - rectangle is one way."},{q:"Which shape can roll?",o:["Circle","Square","Triangle","Rectangle"],a:0,e:"Circle rolls."},{q:"How many sides does a cube have as faces?",o:["6","4","8","12"],a:0,e:"Cube 6 faces."}]},
{name:"Batch 3 - Sequences",qs:[{q:"What comes next? □ △ □ △ ?",o:["□","△","○","☆"],a:0,e:"Alternates."},{q:"Count: 1 square, 2 squares, 4 squares, ?",o:["8 squares","6 squares","5 squares","3 squares"],a:0,e:"Double each time."},{q:"Which is next in size? Small, Medium, Large, ?",o:["Extra Large","Small","Medium","Tiny"],a:0,e:"Growing."},{q:"Pattern: A B C A B C ?",o:["A","B","C","D"],a:0,e:"ABC repeats."},{q:"Which is different? ○ ○ ○ □",o:["□","○","○","○"],a:0,e:"Square different."},{q:"How many corners in 2 triangles?",o:["6","3","4","9"],a:0,e:"3 x 2 = 6."}]},
{name:"Batch 4 - Spatial",qs:[{q:"If you are facing North and turn right, you face ?",o:["East","West","South","North"],a:0,e:"North + right = East."},{q:"Which is above?",o:["Sky is above ground","Ground is above sky","Tree is below root","None"],a:0,e:"Sky above ground."},{q:"A dice has 6 faces. Opposite of 1 is 6. Opposite of 2 is ?",o:["5","3","4","1"],a:0,e:"Opposite faces sum to 7."},{q:"Which net makes a cube?",o:["Cross shape","Straight line","Single square","Triangle"],a:0,e:"Cross shape folds to cube."},{q:"If you stack 3 boxes, top is ?",o:["3rd box","1st box","2nd box","Ground"],a:0,e:"Top is 3rd."},{q:"Which is longest?",o:["1 metre","50 cm","10 cm","1 cm"],a:0,e:"1 m = 100 cm."}]},
{name:"Batch 5 - Logic Pictures",qs:[{q:"If all circles are red, and shape is circle, colour?",o:["Red","Blue","Green","Yellow"],a:0,e:"Circle = red."},{q:"Which shape has no straight lines?",o:["Circle","Square","Triangle","Rectangle"],a:0,e:"Circle is curved."},{q:"How many squares in a 2x2 grid?",o:["5","4","3","6"],a:0,e:"4 small + 1 big = 5."},{q:"Which is symmetry? Butterfly has ?",o:["1 line","0 lines","3 lines","Many"],a:0,e:"Butterfly 1 line."},{q:"If pattern adds 2 dots each time: 2, 4, 6, ?",o:["8","7","10","5"],a:0,e:"6 + 2 = 8."},{q:"Which shape fits? Triangle needs 3 sides. Shape with 4 sides is ?",o:["Quadrilateral","Triangle","Circle","Pentagon"],a:0,e:"4 sides = quadrilateral."}]}
]},
mixed:{title:"Mixed Ability",batches:[
{name:"Batch 1 - Mixed 1",qs:[{q:"Book is to Read as Song is to ?",o:["Sing","Dance","Listen","Play"],a:0,e:"Song is sung."},{q:"Next: 5, 11, 17, 23, ?",o:["29","25","30","28"],a:0,e:"Add 6."},{q:"Which is different? Cat, Dog, Cow, Car",o:["Car","Cat","Dog","Cow"],a:0,e:"Car not animal."},{q:"If 3 + 3 = 6, 6 + 6 = ?",o:["12","10","14","11"],a:0,e:"6 + 6 = 12."},{q:"Which is synonym for HAPPY?",o:["Joyful","Sad","Angry","Tired"],a:0,e:"Happy = joyful."},{q:"How many legs do 5 dogs have?",o:["20","10","15","25"],a:0,e:"5 x 4 = 20."}]},
{name:"Batch 2 - Mixed 2",qs:[{q:"If today is Wednesday, tomorrow is ?",o:["Thursday","Tuesday","Friday","Monday"],a:0,e:"Day after Wed = Thu."},{q:"What is 1/2 of 1/2?",o:["1/4","1/2","1","3/4"],a:0,e:"Half of half = 1/4."},{q:"Which is antonym of BRAVE?",o:["Afraid","Strong","Bold","Courageous"],a:0,e:"Brave opposite afraid."},{q:"Pattern: 10, 20, 40, 80, ?",o:["160","100","120","90"],a:0,e:"Double."},{q:"How many months in 3 years?",o:["36","24","30","12"],a:0,e:"12 x 3 = 36."},{q:"Which is largest?",o:["0.9","0.09","0.99","0.8"],a:2,e:"0.99 is largest."}]},
{name:"Batch 3 - Mixed 3",qs:[{q:"Teacher is to School as Doctor is to ?",o:["Hospital","Patient","Medicine","Nurse"],a:0,e:"Doctor in hospital."},{q:"If 7 x 8 = 56, 56 / 7 = ?",o:["8","7","9","6"],a:0,e:"56 / 7 = 8."},{q:"Which is odd? Apple, Mango, Banana, Carrot",o:["Carrot","Apple","Mango","Banana"],a:0,e:"Carrot vegetable."},{q:"Next: A, C, E, G, ?",o:["I","H","J","K"],a:0,e:"Skip one letter."},{q:"What is 25% of 200?",o:["50","25","75","100"],a:0,e:"200 / 4 = 50."},{q:"Which shape has 5 sides?",o:["Pentagon","Hexagon","Square","Triangle"],a:0,e:"Penta = 5."}]},
{name:"Batch 4 - Mixed 4",qs:[{q:"If all birds can fly, and penguin is a bird, penguin can ?",o:["Fly (in logic)","Not fly","Swim only","Run"],a:0,e:"Logic says fly, even if real life different."},{q:"What is 9 squared?",o:["81","18","72","90"],a:0,e:"9 x 9 = 81."},{q:"Synonym for QUICK?",o:["Fast","Slow","Late","Lazy"],a:0,e:"Quick = fast."},{q:"If 1 hour = 60 min, 2.5 hours = ?",o:["150 min","120 min","180 min","200 min"],a:0,e:"120 + 30 = 150."},{q:"Which is prime?",o:["13","15","21","25"],a:0,e:"13 prime."},{q:"Pattern: ▲ ■ ▲ ■ ?",o:["▲","■","●","★"],a:0,e:"Alternates."}]},
{name:"Batch 5 - Mixed 5",qs:[{q:"Jada is 10. In 5 years she will be ?",o:["15","12","20","5"],a:0,e:"10 + 5 = 15."},{q:"Antonym of EARLY?",o:["Late","Soon","Quick","First"],a:0,e:"Early opposite late."},{q:"If 2 books cost $400, 5 books cost ?",o:["$1,000","$800","$600","$1,200"],a:0,e:"200 x 5 = 1000."},{q:"Which is different? Run, Jump, Swim, Table",o:["Table","Run","Jump","Swim"],a:0,e:"Table not action."},{q:"Next: 2, 4, 8, 16, ?",o:["32","20","24","18"],a:0,e:"Double."},{q:"Best title for story about helping others?",o:["Kindness Matters","The Red Car","My Dog","Going Home"],a:0,e:"Title matches kindness."}]}
]}
};
function showHome(){location.reload();}
function showBatches(sub){
var main=document.getElementById("main");main.innerHTML="";
var h=document.createElement("h2");h.style.textAlign="center";h.textContent=DATA[sub].title;main.appendChild(h);
DATA[sub].batches.forEach(function(b,i){
var btn=document.createElement("button");btn.className="btn";btn.textContent=b.name;
btn.onclick=function(){openBatch(sub,i)};main.appendChild(btn);});
var back=document.createElement("button");back.className="btn back";back.textContent="Back to Subjects";back.onclick=showHome;main.appendChild(back);window.scrollTo(0,0);
}
function openBatch(sub,i){
var main=document.getElementById("main");main.innerHTML="";
var b=DATA[sub].batches[i];
var h=document.createElement("h2");h.style.textAlign="center";h.textContent=b.name;main.appendChild(h);
b.qs.forEach(function(q,qi){
var card=document.createElement("div");card.className="card";
var t=document.createElement("b");t.textContent="Q"+(qi+1)+". "+q.q;card.appendChild(t);
q.o.forEach(function(opt,oi){
var ob=document.createElement("button");ob.className="opt";ob.textContent=opt;
ob.onclick=function(){var btns=card.querySelectorAll(".opt");btns.forEach(function(x){x.disabled=true});ob.className="opt "+(oi===q.a?"correct":"wrong");exp.style.display="block"};card.appendChild(ob);});
var exp=document.createElement("div");exp.className="exp";exp.textContent=q.e;card.appendChild(exp);
main.appendChild(card);});
var back=document.createElement("button");back.className="btn back";back.textContent="Back to Batches";back.onclick=function(){showBatches(sub)};main.appendChild(back);window.scrollTo(0,0);
}
</script></body></html>
