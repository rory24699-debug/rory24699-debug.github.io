<!-- SEARCH AT END -->
<div style="background:#fff;border-radius:14px;padding:18px;margin-top:12px">
<h3 style="text-align:center;margin:0">🔍 Search All 58 Questions</h3>
<p style="text-align:center;color:#555;font-size:14px">Type a word - placement, Grade 6, exam day...</p>
<input id="searchEnd" onkeyup="searchEnd()" placeholder="Type here to search..." style="width:100%;padding:14px;border-radius:10px;border:1px solid #ddd;font-size:16px;box-sizing:border-box">
<div id="searchResults"></div>
</div>

<script>
function searchEnd(){
  let word = document.getElementById("searchEnd").value.toLowerCase();
  let out = document.getElementById("searchResults");
  if(word.length < 2){ out.innerHTML=""; return; }
  let found = "";
  let count = 0;
  DATA.forEach(s=>{
    s.qs.forEach(q=>{
      if((q[0]+" "+q[1]).toLowerCase().includes(word)){
        count++;
        found += `<div style="background:#f8fafc;border-radius:10px;padding:12px;margin-top:10px"><b>${q[0]}</b><p style="font-size:14px;color:#333">${q[1]}</p><small style="color:#1e6fd9">${s.title}</small></div>`;
      }
    });
  });
  out.innerHTML = count==0 ? "<p style='text-align:center'>No match found. Try another word.</p>" : `<p style="font-weight:bold;margin-top:10px">${count} found:</p>` + found;
}
</script>
