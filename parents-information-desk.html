<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f4f6}

.notice{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:6px solid #1e3a5f;cursor:pointer;display:none}
.notice.what{border-left-color:#2563eb}

.notice.placement{border-left-color:#dc2626}
.notice.home{border-left-color:#16a34a}

.notice.special{border-left-color:#db2777}
.notice.dates{border-left-color:#0891b2}
.top{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#374151}
.top span{color:#6b7280;font-weight:normal}
.notice p{font-size:15px;margin:8px 0 0;line-height:1.5;color:#111827}
.notice p.ans{display:none}
.notice.open p.ans{display:block}
.notice::after{content:"▼ Tap to see answer";display:block;font-size:12px;color:#6b7280;margin-top:8px;font-weight:bold}
.notice.open::after{content:"▲ Tap to close"}
.card-btn{display:flex;justify-content:center;align-items:center;width:100%;min-height:60px;border-radius:20px;padding:12px;text-align:center;text-decoration:none;color:#fff;margin-top:18px;background:#1e3a5f;font-weight:bold;font-size:18px}
.sect{display:block;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;text-decoration:none;color:#111;border-left:6px solid #2563eb}
.sect b{font-size:16px}
.sect span{font-size:14px;color:#555}
