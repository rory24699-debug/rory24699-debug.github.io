<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPLink JA - Grade 6</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    color: #17365d;
    text-align: center;
    margin: 0;
    padding: 20px;
}
header {
    background: #102b50;
    color: white;
    padding: 25px 10px;
    border-radius: 12px;
}
.container {
    max-width: 600px;
    margin: 25px auto;
}
button {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #174a7e;
    color: white;
    cursor: pointer;
}
.back {
    background: #555;
}
.hidden {
    display: none;
}
</style>
</head>
<body><header>
    <h1>PEPLink JA</h1>
    <p>Grade 6 — Exam Preparation Centre</p>
</header><div class="container" id="mainMenu">
    <h2>Welcome to Grade 6</h2>
    <p>Choose a service to continue.</p><button onclick="showPractice()">PEP Practice Centre</button>
<button onclick="comingSoon('Learning Centre')">Learning Centre</button>
<button onclick="comingSoon('Parent Dashboard')">Parent Dashboard</button>
<button class="back" onclick="location.href='index.html'">Back to Home</button>

</div><div class="container hidden" id="subjectMenu">
    <h2>PEP Practice Centre</h2>
    <p>Choose a subject.</p><button onclick="showActivities('Mathematics')">Mathematics</button>
<button onclick="showActivities('Language Arts')">Language Arts</button>
<button onclick="showActivities('Science')">Science</button>
<button onclick="showActivities('Social Studies')">Social Studies</button>
<button class="back" onclick="showMain()">Back to Services</button>

</div><div class="container hidden" id="activityMenu">
    <h2 id="subjectTitle">Subject</h2>
    <p>Choose a learning activity.</p><button onclick="comingSoon('Practice Questions')">Practice Questions</button>
<button onclick="comingSoon('Quizzes')">Quizzes</button>
<button onclick="comingSoon('Mock Tests')">Mock Tests</button>
<button class="back" onclick="showPractice()">Back to Subjects</button>

</div><script>
function hideAll() {
    document.getElementById('mainMenu').classList.add('hidden');
    document.getElementById('subjectMenu').classList.add('hidden');
    document.getElementById('activityMenu').classList.add('hidden');
}

function showMain() {
    hideAll();
    document.getElementById('mainMenu').classList.remove('hidden');
}

function showPractice() {
    hideAll();
    document.getElementById('subjectMenu').classList.remove('hidden');
}

function showActivities(subject) {
    hideAll();
    document.getElementById('activityMenu').classList.remove('hidden');
    document.getElementById('subjectTitle').textContent = subject;
}

function comingSoon(service) {
    alert(service + ' is coming soon!');
}
</script></body>
</html>
