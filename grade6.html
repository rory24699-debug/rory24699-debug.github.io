<!DOCTYPE html>
<html lang="en">
<head>

<title>Grade 6 - Final Mastery Centre</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f4f6f9}
.header{background:#1a324f;color:#fff;text-align:center;padding:32px 20px 26px;border-radius:0 0 24px 24px}
.header h1{margin:0;font-size:32px;font-weight:900}
.header p{margin:8px 0 0;font-size:18px;opacity:.95}
.container{max-width:480px;margin:0 auto;padding:24px 18px;text-align:center}
.welcome{color:#1a324f;font-size:28px;font-weight:800;margin:6px 0 4px}
.subtitle{color:#555;font-size:16px;margin-bottom:22px}
.btn{display:block;width:100%;height:78px;line-height:78px;border-radius:20px;text-decoration:none;color:#fff;font-weight:800;font-size:19px;text-align:center;margin-bottom:16px}
.blue{background:#23486b}
.green{background:#2d7a3f}
.grey{background:#4a4a4a}
.session{background:#e8f5e9;color:#1a324f;font-weight:700;padding:16px;border-radius:14px;margin-top:10px;font-size:16px}

<body>
<div class="header">
<h1>PEPlink JA</h1>
<p>Grade 6 — Final Mastery Centre</p>
</div>

<div class="container">
<div class="welcome">Welcome to Grade 6</div>

<a href="grade6-curriculum-learning-centre.html" class="btn blue">Curriculum & Learning Centre</a>

<div class="session">Session Duration: <span id="t">00:00:00</span></div>
</div>

<script>
let s=0;setInterval(()=>{s++;let h=String(Math.floor(s/3600)).padStart(2,'0');let m=String(Math.floor(s%3600/60)).padStart(2,'0');let sec=String(s%60).padStart(2,'0');document.getElementById('t').textContent=h+':'+m+':'+sec},1000);
</script>
