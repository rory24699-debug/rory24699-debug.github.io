<script>
const tests=[
{name:"Batch 1 - Reading Comprehension", passage:"Every Friday afternoon, Grade 4 students at Green Valley Primary School worked in their school garden. Their teacher, Miss Brown, divided the students into small groups. Some students watered the plants, while others removed weeds and planted seeds. One Friday, the students noticed that several tomato plants were turning yellow. They informed Miss Brown, who explained that the plants needed better care. The students checked the soil and discovered that it was too dry. They quickly watered the plants and agreed to create a watering schedule. Each group would take responsibility for the garden on a different day. Within a few weeks, the tomato plants became healthy again. The students were proud of their work because they had learned the importance of teamwork and responsibility.", qs:[
{q:"When did the Grade 4 students work in the school garden?", o:["Every Monday","Every Wednesday","Every Friday","Every Saturday"], a:2},
{q:"Who was the students' teacher?", o:["Miss Green","Miss Brown","Mrs White","Miss James"], a:1},
{q:"What did some students do in the garden?", o:["Painted the classroom","Watered the plants","Cleaned the library","Played football"], a:1},
{q:"What problem did the students notice?", o:["The tomato plants were turning yellow","The garden fence was broken","The flowers had disappeared","The seeds were missing"], a:0},
{q:"Why were the tomato plants turning yellow?", o:["They received too much sunlight","They had too many flowers","The soil was too dry","The garden was too small"], a:2},
{q:"What did the students do after checking the soil?", o:["Removed the tomato plants","Watered the plants","Left the garden","Bought new seeds"], a:1},
{q:"What is a watering schedule?", o:["A plan showing when plants should be watered","A list of students' favourite plants","A record of classroom lessons","A list of gardening tools"], a:0},
{q:"What happened to the tomato plants after a few weeks?", o:["They dried up","They became healthy again","They were removed","They stopped growing"], a:1},
{q:"Which word best describes the students' behaviour?", o:["Careless","Lazy","Responsible","Unfriendly"], a:2},
{q:"What is the main lesson of the passage?", o:["Gardens are difficult to maintain","Teamwork and responsibility are important","Tomatoes grow without water","Students should avoid gardening"], a:1}
]},
{name:"Batch 2 - Vocabulary", qs:[
{q:"What is the meaning of the word 'enormous'?", o:["Very small","Very large","Very weak","Very short"], a:1},
{q:"Which word is the opposite of 'ancient'?", o:["Old","Modern","Historic","Past"], a:1},
{q:"Which word means the same as 'happy'?", o:["Angry","Joyful","Tired","Afraid"], a:1},
{q:"What does the word 'rapid' mean?", o:["Slow","Quiet","Fast","Careful"], a:2},
{q:"Which word is the opposite of 'generous'?", o:["Kind","Selfish","Helpful","Friendly"], a:1},
{q:"What does 'exhausted' mean?", o:["Very tired","Very excited","Very hungry","Very cold"], a:0},
{q:"Which word means the same as 'begin'?", o:["Finish","Start","Stop","Leave"], a:1},
{q:"What is the meaning of 'fragile'?", o:["Easily broken","Very heavy","Difficult to find","Extremely strong"], a:0},
{q:"Which word is the opposite of 'brave'?", o:["Courageous","Fearful","Bold","Strong"], a:1},
{q:"What does the word 'observe' mean?", o:["To forget","To watch carefully","To run quickly","To speak loudly"], a:1}
]},
 {name:"Batch 3 - Grammar", qs:[
{q:"Which sentence is written correctly?", o:["She go to school every day.","She goes to school every day.","She going to school every day.","She gone to school every day."], a:1},
{q:"Choose the correct past tense of 'teach'.", o:["Teached","Teaching","Taught","Teaches"], a:2},
{q:"Which word is a pronoun?", o:["Quickly","Beautiful","They","Garden"], a:2},
{q:"Choose the correct article: 'I saw ___ elephant at the zoo.'", o:["A","An","Thee","Some"], a:1},
{q:"Which word is an adjective in this sentence? 'The little boy smiled.'", o:["The","Little","Boy","Smiled"], a:1},
{q:"Choose the correct plural of 'child'.", o:["Childs","Childes","Children","Childrens"], a:2},
{q:"Which sentence uses the correct subject-verb agreement?", o:["The dogs barks loudly.","The dogs bark loudly.","The dogs barking loudly.","The dogs is barking loudly."], a:1},
{q:"Identify the adverb in this sentence: 'The girl sang beautifully.'", o:["Girl","Sang","The","Beautifully"], a:3},
{q:"Choose the correct conjunction: 'I wanted to play, ___ it was raining.'", o:["Because","But","Or","So"], a:1},
{q:"Choose the correct possessive form: 'The bag belongs to Sarah.'", o:["Sarahs bag","Sarah bag","Sarah's bag","Sarahs' bag"], a:2}
]}, 
{name:"Batch 4 - Grammar", qs:[
{q:"Choose the correct verb: 'The children ___ playing outside.'", o:["Is","Am","Are","Was"], a:2},
{q:"Which sentence is in the future tense?", o:["I walked to school.","I walk to school.","I will walk to school.","I am walking to school."], a:2},
{q:"Which word is a noun?", o:["Jump","Happiness","Quickly","Beautiful"], a:1},
{q:"Choose the correct pronoun: 'Maria and ___ went shopping.'", o:["Me","I","Mine","My"], a:1},
{q:"Which sentence uses the correct punctuation?", o:["Where are you going.","Where are you going?","Where are you going!","Where are you going,"], a:1},
{q:"Choose the correct comparative adjective.", o:["Tall","Tallest","Taller","More tall"], a:2},
{q:"Which word is a preposition in this sentence? 'The cat slept under the table.'", o:["Cat","Slept","Under","Table"], a:2},
{q:"Choose the correct plural of 'tooth'.", o:["Tooths","Teeth","Toothes","Toothies"], a:1},
{q:"Which sentence is grammatically correct?", o:["He don't like mangoes.","He doesn't likes mangoes.","He doesn't like mangoes.","He not like mangoes."], a:2},
{q:"Choose the correct word: 'The students completed ___ homework.'", o:["There","They're","Their","Them"], a:2}
]},
{name:"Batch 5 - Spelling & Punctuation", qs:[
{q:"Which word is spelt correctly?", o:["Becaus","Because","Becose","Becouse"], a:1},
{q:"Which sentence uses the comma correctly?", o:["I bought apples oranges and grapes.","I bought, apples oranges and grapes.","I bought apples, oranges, and grapes.","I bought apples oranges, and grapes."], a:2},
{q:"Which word is spelt correctly?", o:["Freind","Frend","Friend","Freand"], a:2},
{q:"Which punctuation mark belongs at the end of an exclamation?", o:["Full stop","Question mark","Comma","Exclamation mark"], a:3},
{q:"Choose the correctly spelt word.", o:["Necessary","Neccessary","Necesary","Necessery"], a:0},
{q:"Which sentence uses the apostrophe correctly?", o:["The girls bag is red.","The girl's bag is red.","The girls' bag's is red.","The girls bag's is red."], a:1},
{q:"Which word is spelt incorrectly?", o:["Beautiful","Important","Definately","Remember"], a:2},
{q:"Which sentence uses capital letters correctly?", o:["my birthday is in july.","My birthday is in July.","My Birthday is in july.","my Birthday is in July."], a:1},
{q:"Choose the correctly spelt word.", o:["Environment","Enviroment","Envirnoment","Environmant"], a:0},
{q:"Which punctuation mark is used to separate items in a list?", o:["Apostrophe","Comma","Question mark","Full stop"], a:1}
]},
{name:"Batch 6 - Spelling & Punctuation", qs:[
{q:"Which word is spelt correctly?", o:["Receive","Recieve","Receeve","Reseive"], a:0},
{q:"Which sentence has the correct punctuation?", o:["What a beautiful day.","What a beautiful day?","What a beautiful day!","What, a beautiful day"], a:2},
{q:"Choose the correctly spelt word.", o:["Wednesday","Wensday","Wednsday","Wendsday"], a:0},
{q:"Which sentence uses quotation marks correctly?", o:["Mary said, I am happy.","Mary said, 'I am happy.'","Mary said I 'am happy.","Mary said, I 'am happy."], a:1},
{q:"Which word is spelt incorrectly?", o:["February","Separate","Occasion","Tommorrow"], a:3},
{q:"Which punctuation mark should complete this sentence? 'Please close the door___'", o:["Question mark","Full stop","Comma","Apostrophe"], a:1},
{q:"Choose the correctly spelt word.", o:["Knowledge","Knowlege","Knowladge","Nolledge"], a:0},
{q:"Which sentence uses capital letters correctly?", o:["We visited kingston in june.","We visited Kingston in June.","We visited kingston in June.","we visited Kingston in june."], a:1},
{q:"Which word is spelt correctly?", o:["Library","Libary","Librery","Liberry"], a:0},
{q:"Which punctuation mark shows possession in 'the boy's bicycle'?", o:["Comma","Colon","Apostrophe","Semicolon"], a:2}
]},
{name:"Batch 7 - Sentence Structure", qs:[
{q:"Which group of words is a complete sentence?", o:["Running through the park.","The children played outside.","Because it was raining.","Under the big tree."], a:1},
{q:"Which sentence has the correct word order?", o:["The market to mother went.","Mother went to the market.","Went mother market the to.","The went mother to market."], a:1},
{q:"Which sentence is a command?", o:["Where is your pencil?","The pencil is sharp.","Please close the window.","What a lovely pencil!"], a:2},
{q:"Which sentence is a question?", o:["The birds are singing.","Please sit down.","Where did you put my book?","What a wonderful surprise!"], a:2},
{q:"Which sentence contains a compound subject?", o:["The boy ran quickly.","John and Peter played football.","The dog barked loudly.","She opened the door."], a:1},
{q:"Choose the best way to combine these sentences: 'The sun was shining. We went outside.'", o:["The sun was shining, so we went outside.","The sun was shining because outside.","We went outside the sun shining.","The sun, we went outside shining."], a:0},
{q:"Which sentence contains a compound predicate?", o:["The little girl smiled.","David washed the car and cleaned the windows.","The tall boy is my brother.","The red flowers are beautiful."], a:1},
{q:"Which group of words is a sentence fragment?", o:["My sister likes reading.","The teacher marked our books.","After the heavy rain.","We visited our grandmother."], a:2},
{q:"Which sentence is written in the correct order?", o:["Every morning breakfast eats Sarah.","Sarah eats breakfast every morning.","Breakfast every Sarah morning eats.","Eats Sarah every breakfast morning."], a:1},
{q:"Which sentence is an exclamation?", o:["Can you help me?","The children are playing.","What an exciting game!","Please bring your book."], a:2}
]},
{name:"Batch 8 - Sentence Structure", qs:[
{q:"Which sentence is a compound sentence?", o:["The baby is sleeping.","I wanted to play, but it started raining.","The tall boy ran quickly.","My mother cooked dinner."], a:1},
{q:"Choose the correct ending to complete the sentence: 'Although it was raining, ___.'", o:["because the clouds","we continued playing","under the tree","when the bell rang"], a:1},
{q:"Which sentence has the correct subject and predicate?", o:["The children / played football.","Played / the children football.","Football / the children played.","The / children played football."], a:0},
{q:"Which sentence is written correctly?", o:["Because she was tired.","She went to bed early because she was tired.","Because tired she was.","She because was tired."], a:1},
{q:"Which word best connects these sentences? 'I studied hard, ___ I passed the test.'", o:["But","So","Although","Because"], a:1},
{q:"Which sentence contains a dependent clause?", o:["The dog barked loudly.","When the rain stopped, we went outside.","The children played football.","My father drives a car."], a:1},
{q:"Choose the correct sentence.", o:["The girl who won the race is my cousin.","The girl won who the race is my cousin.","Who the girl won the race is my cousin.","The girl is my cousin who won the race."], a:0},
{q:"Which sentence uses the correct word order?", o:["Always she arrives early.","She always arrives early.","Arrives always she early.","Early always arrives she."], a:1},
{q:"Which sentence combines the ideas correctly? 'The boy was hungry. He ate a sandwich.'", o:["The boy was hungry, so he ate a sandwich.","The boy hungry because sandwich.","He ate, the boy was hungry sandwich.","The sandwich was hungry, so the boy ate."], a:0},
{q:"Which sentence is complex?", o:["The bird sang.","The bird sang and the children listened.","The children listened when the bird sang.","The bird was colourful."], a:2}
]},
{name:"Batch 9 - Writing Skills", qs:[
{q:"Which sentence is the best opening for a story about a mysterious visitor?", o:["I like eating rice.","One dark evening, someone knocked loudly at our door.","My school is very big.","The sun is hot today."], a:1},
{q:"Which sentence gives the clearest description of a place?", o:["The place was nice.","It was somewhere.","The garden was filled with colourful flowers and tall trees.","I went there yesterday."], a:2},
{q:"Which sentence would be most suitable for ending a story?", o:["Suddenly, the door opened.","After that, we walked to school.","From that day, I never forgot the kindness shown to me.","The children were running."], a:2},
{q:"Which sentence is most suitable for a formal letter?", o:["Hey, what's up?","Dear Principal, I am writing to request permission to use the school hall.","Yo, I need the hall.","Give me the hall, please."], a:1},
{q:"Which word would make this description more interesting? 'The ___ waterfall flowed down the mountain.'", o:["Nice","Beautiful","Thing","Good"], a:1},
{q:"Which sentence uses descriptive language?", o:["The dog is there.","The fluffy brown dog wagged its tail happily.","I saw a dog.","The dog went away."], a:1},
{q:"Which sentence gives a clear instruction?", o:["Maybe the book is there.","Please place your books neatly on the desk.","The books are colourful.","I like reading books."], a:1},
{q:"Which sentence is the best topic sentence for a paragraph about healthy eating?", o:["My shoes are black.","Eating healthy foods helps our bodies grow strong and stay healthy.","Yesterday was Sunday.","The mango fell from the tree."], a:1},
{q:"Which word best connects ideas showing sequence?", o:["However","Finally","Although","Because"], a:1},
{q:"Which sentence expresses an opinion?", o:["Jamaica is an island in the Caribbean.","The school has twelve classrooms.","I believe reading is the most enjoyable hobby.","The sun rises in the east."], a:2}
]},
{name:"Batch 10 - Writing Skills", qs:[
{q:"Which sentence is the best way to begin a friendly letter?", o:["Dear Grandma,","Yours faithfully,","The End.","Goodbye forever."], a:0},
{q:"Which detail would best support a paragraph about keeping the environment clean?", o:["Playing football after school.","Throwing rubbish into bins and recycling materials.","Buying new shoes.","Watching television every evening."], a:1},
{q:"Which sentence uses the most appropriate language in a formal invitation?", o:["Come over if you feel like it.","You are cordially invited to attend our school concert.","Hey, show up at the concert.","Don't miss it, okay?"], a:1},
{q:"Which sentence would be the best conclusion for a paragraph about exercise?", o:["My favourite colour is blue.","Exercise is therefore an important part of staying healthy.","The bus arrived late.","I bought a new pencil."], a:1},
{q:"Which sentence gives the clearest sequence of events?", o:["I ate breakfast, brushed my teeth, and walked to school.","School breakfast walked teeth.","I like school very much.","My breakfast was delicious."], a:0},
{q:"Which sentence is most suitable for a newspaper report?", o:["Guess what happened yesterday!","A fire broke out at a shop in Spanish Town yesterday afternoon.","That was really crazy!","I cannot believe what I saw."], a:1},
{q:"Which sentence uses the correct descriptive details?", o:["The food was food.","The warm, freshly baked bread filled the kitchen with a sweet smell.","The kitchen was there.","We ate something yesterday."], a:1},
{q:"Which phrase is best for politely requesting information?", o:["Tell me now!","I would appreciate it if you could provide more information.","You must answer me.","Why are you not telling me?"], a:1},
{q:"Which sentence would best persuade students to read more books?", o:["Books are usually kept on shelves.","Reading every day can improve your vocabulary and help you discover new ideas.","My classroom has windows.","Some books have many pages."], a:1},
{q:"Which sentence is the best summary of a story about a girl who helped an injured bird?", o:["The girl enjoyed playing outside.","A girl showed kindness by caring for an injured bird until it recovered.","The bird had colourful feathers.","The girl lived near a large tree."], a:1}
]},
];
let curTest=0, curQ=0, score=0;
const menu=document.getElementById('menu');
tests.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.name+" ("+t.qs.length+" questions)";b.onclick=()=>startTest(i);menu.appendChild(b);});
function startTest(i){curTest=i;curQ=0;score=0;menu.style.display='none';document.getElementById('quiz').style.display='block';showQ();}
function showQ(){let t=tests[curTest];if(curQ>=t.qs.length){showResult();return;}let q=t.qs[curQ];let d=document.getElementById('quiz');d.innerHTML="<h3>"+t.name+" - Q"+(curQ+1)+" of "+t.qs.length+"</h3>"+(t.passage?"<p style='background:#f0f7ff;padding:10px;border-radius:8px'><b>Read this passage:</b><br>"+t.passage+"</p>":"")+"<p>"+q.q+"</p>";q.o.forEach((opt,j)=>{let b=document.createElement('button');b.textContent=["A) ","B) ","C) ","D) "][j]+opt;b.onclick=()=>{if(j===q.a){score++;b.classList.add('correct');}else{b.classList.add('wrong');}setTimeout(()=>{curQ++;showQ();},400);};d.appendChild(b);});}
function showResult(){document.getElementById('quiz').style.display='none';let r=document.getElementById('result');r.style.display='block';let t=tests[curTest];r.innerHTML="<h3>Finished "+t.name+"</h3><p>Score: "+score+" / "+t.qs.length+"</p><p>Type WhatsApp number e.g. 18761234567</p><input id='phone' placeholder='Type WhatsApp number' style='width:100%;padding:12px'><button onclick='sendWA()'>Send Score to Mom / Dad</button><button onclick='location.reload()'>Back to Batches</button>";}
function sendWA(){let num=document.getElementById('phone').value.replace(/[^0-9]/g,'');if(num.length===10 && (num.startsWith('876')||num.startsWith('658'))) num='1'+num;if(num.length!==11){alert('Please type a full WhatsApp number, e.g. 18761234567');return;}let t=tests[curTest];let msg="PEPLink JA - Grade 4 Language Arts - Finished "+t.name+" - Score: "+score+" / "+t.qs.length;window.open("https://wa.me/"+num+"?text="+encodeURIComponent(msg));}
</script></body></html>
