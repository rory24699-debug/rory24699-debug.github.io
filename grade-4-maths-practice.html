let curTest=0, curQ=0, score=0, answered=false, userAnswers=[];
function renderTests(){
  document.getElementById('tests').innerHTML = allTests.map((_,i)=>`<button class="testBtn ${i===curTest?'active':''}" onclick="switchTest(${i})">Test ${i+1}</button>`).join('');
}
function switchTest(i){curTest=i;curQ=0;score=0;userAnswers=[];renderTests();showQ();}
function showQ(){
  const t=allTests[curTest][curQ];
  document.getElementById('qhead').innerText=`📘 Test ${curTest+1} - Question ${curQ+1} of 20`;
  document.getElementById('question').innerText=t.q;
  document.getElementById('scoreBox').innerText = curQ>0 ? `Score so far: ${score} / ${curQ}` : '';
  document.getElementById('options').innerHTML=t.o.map((opt,idx)=>`<div class="opt" onclick="pick(this,${idx})">${opt}</div>`).join('');
  answered=false; document.getElementById('nextBtn').disabled=true;
  document.getElementById('nextBtn').innerText = curQ===19 ? 'Finish →' : 'Next →';
}
let picked=-1;
function pick(el,idx){document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');picked=idx;answered=true;document.getElementById('nextBtn').disabled=false;}
function nextQ(){
  if(!answered) return;
  const t=allTests[curTest][curQ];
  if(picked===t.a) score++;
  userAnswers.push(picked);
  if(curQ<19){curQ++;showQ();}
  else{finish();}
}
function finish(){
  const total=score;
  const wa=document.getElementById('waNum').value.replace(/[^0-9]/g,'');
  let msg=`🇯🇲 PEPLink JA - Grade 4 Maths - Test ${curTest+1} RESULT%0A%0AScore: ${total} / 20%0A`;
  document.getElementById('quiz').innerHTML=`<div class="score" style="font-size:26px">🎉 Test ${curTest+1} Complete!<br>Score: ${total} / 20</div><p style="text-align:center">${total>=15?'Excellent! 🌟':total>=10?'Good job! Keep going 👍':'Keep practising! You can do it 💪'}</p><button class="btn" onclick="sendWA()">Send Result on WhatsApp</button><button class="btn" style="background:#2563eb" onclick="location.reload()">Try Again ↻</button><button class="btn" onclick="location.href='index.html'">← Go back to PEP Centre</button>`;
  window._waMsg=msg; window._waNum=wa;
}
function sendWA(){
  let num=window._waNum;
  let url = num ? `https://wa.me/${num}?text=${window._waMsg}` : `https://wa.me/?text=${window._waMsg}`;
  window.open(url,'_blank');
}
renderTests(); showQ();
