<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Grade 5 Practice - PEPLink JA</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:15px}
.container{max-width:600px;margin:auto}
.card{background:white;padding:20px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center}
h1{font-size:28px;margin:5px 0}
.sub{color:#555;margin-bottom:15px}
.tests{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:15px}
.tests button{background:#ddd;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;font-size:16px;cursor:pointer}
.tests button.active{background:#2563eb;color:white}
.q{font-size:22px;font-weight:bold;text-align:left;margin:15px 0}
.opt{display:block;width:100%;text-align:left;background:white;border:2px solid #ddd;padding:14px;border-radius:12px;margin:8px 0;font-size:19px;cursor:pointer}
.opt.correct{background:#dcfce7;border-color:#16a34a}
.opt.wrong{background:#fee2e2;border-color:#dc2626}
.opt:disabled{opacity:.6}
.feedback{background:#fef9c3;padding:14px;border-radius:12px;text-align:left;margin-top:12px;font-size:18px;display:none}
.feedback button{background:#2563eb;color:white;border:none;padding:14px;width:100%;border-radius:10px;font-weight:bold;font-size:19px;margin-top:10px;cursor:pointer}
input[type=tel]{width:100%;padding:14px;border:2px solid #ddd;border-radius:12px;font-size:19px;box-sizing:border-box}
.wa{background:#22c55e;color:white;border:none;padding:15px;width:100%;border-radius:12px;font-weight:bold;font-size:19px;margin-top:12px;cursor:pointer}
.nextTest{background:#2563eb;color:white;border:none;padding:15px;width:100%;border-radius:12px;font-weight:bold;font-size:19px;margin-top:12px;cursor:pointer}
.back{display:block;background:#1e3a5f;color:white;text-align:center;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:19px;margin-top:15px}

</head>

<p class="sub">Test 1-5 • 20 questions each • Score is locked - no cheating</p>
<div class="tests" id="testBtns"></div>
<div id="area"></div>
</div>
<a class="back" href="grade5-pep-practice.html">← Back to PEP Practice Centre</a>
</div>

let curTest=1, curQ=0, score=0, answered=false;
function renderBtns(){
  let h="";
  for(let i=1;i<=5;i++) h+=`<button class="${i==curTest?'active':''}" onclick="goTest(${i})">Test ${i}</button>`;
  document.getElementById('testBtns').innerHTML=h;
}
function goTest(n){curTest=n;curQ=0;score=0;renderBtns();showQ();}
function showQ(){
  answered=false;
  let list=DATA[curTest];
  let q=list[curQ];
  document.getElementById('area').innerHTML=`<p style="text-align:left">📘 Test ${curTest} - Question ${curQ+1} of 20</p><div class="q">${q[0]}</div>`+q[1].map((o,i)=>`<button class="opt" onclick="check(${i},this)">${o}</button>`).join('')+`<div class="feedback" id="fb"></div>`;
}
function check(i,btn){
  if(answered) return; answered=true;
  let q=DATA[curTest][curQ];
  let btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  if(i==q[2]){score++; btn.classList.add('correct'); document.getElementById('fb').innerHTML=`✅ <b>Correct!</b> ${q[3]}<br><button onclick="nextQ()">Next Question →</button>`;}
  else{btn.classList.add('wrong'); btns[q[2]].classList.add('correct'); document.getElementById('fb').innerHTML=`❌ Correct answer is <b>${q[1][q[2]]}</b>. ${q[3]}<br><button onclick="nextQ()">Next Question →</button>`;}
  document.getElementById('fb').style.display='block';
}
function nextQ(){
  curQ++;
  if(curQ>=20) showResult(); else showQ();
}
function showResult(){
  let next = curTest<5 ? curTest+1 : 1;
  let nextLabel = curTest<5 ? `Next Test → Test ${next}` : `Back to Test 1`;
  document.getElementById('area').innerHTML=`<h2>🎉 Done! Test ${curTest}</h2><h2>Score: <b>${score} / 20</b></h2><p>This score is LOCKED - it is filled in automatically</p><p style="text-align:left">Send score to Mom / anyone:</p><input type="tel" id="phone" placeholder="1876XXXXXXX" value="1876"><p style="color:#555">Type number with country code - Jamaica is 1 + 876 / 658. No spaces or -</p><button class="wa" onclick="sendWA()">Send Score on WhatsApp 📲</button><button class="nextTest" onclick="goTest(${next})">${nextLabel}</button>`;
}
function sendWA(){
  let ph=document.getElementById('phone').value.replace(/[^0-9]/g,'');
  if(ph.length<10){alert('Type full number with country code, e.g. 1876XXXXXXX');return;}
  let msg=`Hi! 🇯🇲 PEPLink JA - Grade 5 Mathematics Test ${curTest} Score: ${score} / 20`;
  window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank');
}
renderBtns(); showQ();
</script>
</body>
</html>
