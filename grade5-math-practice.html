<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 5 PEP - Mathematics</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:12px}
.card{max-width:650px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
/* NEW HEADER LIKE GRADE 4 */
.header{background:#1e3a5f;color:#fff;text-align:center;padding:28px 16px;border-radius:18px}
.header h1{margin:0;font-size:24px;line-height:1.3;font-weight:900}
.header p{margin:12px 0 0;font-size:15px;opacity:.9}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}
.tab{padding:10px 18px;border:0;border-radius:25px;background:#e5e7eb;font-weight:bold;cursor:pointer;font-size:15px}
.tab.active{background:#1e3a5f;color:#fff}
.qhead{font-size:15px;color:#333;margin-bottom:8px}
.qtext{font-size:20px;font-weight:bold;margin-bottom:15px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1.5px solid #ddd;border-radius:12px;background:#fff;font-size:17px;cursor:pointer;box-sizing:border-box}
.opt.selected{border-color:#2563eb;background:#dbeafe}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
#nextBtn{background:#1e3a5f;color:#fff;display:block}
#submitBtn{background:#2563eb;color:#fff;display:none}
#result{text-align:center;font-size:18px;font-weight:bold;margin-top:12px}
.small{text-align:center;color:#666;font-size:13px;margin-top:6px}
.homeBtn{display:block;text-align:center;text-decoration:none;background:#1e3a5f;color:#fff;padding:14px;border-radius:10px;font-weight:bold;font-size:17px;margin-top:12px}
/* WHATSAPP POPUP */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
.popup.show{display:flex}.popbox{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:22px;text-align:center}
.popbox input{width:100%;padding:16px;border:2px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box;margin-top:14px}
.popbox .green{background:#25D366;color:#fff;border:0;padding:16px;width:100%;border-radius:14px;font-size:18px;font-weight:800;margin-top:14px;cursor:pointer}
.popbox .grey{background:#888;color:#fff;border:0;padding:16px;width:100%;border-radius:14px;font-size:18px;font-weight:800;margin-top:14px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<!-- NEW HEADER -->
<div class="header">
<h1>🇯🇲 Grade 5 PEP - Mathematics<br>100 Questions - 5 Tests</h1>
<p>Test 1-5 • 20 questions each • Score is locked - no cheating</p>
</div>
<div class="tabs" id="tabs"></div>
<div class="qhead" id="qhead"></div>
<div class="qtext" id="qtext"></div>
<div id="opts"></div>
<button class="btn" id="nextBtn" onclick="nextQ()">Next ➡️</button>
<button class="btn" id="submitBtn" onclick="submitTest()">Submit Test</button>
<div id="result"></div>
<a href="index.html" class="homeBtn">⬅️ Go back to PEP Practice Centre</a>
</div>

<!-- WHATSAPP POPUP - ONLY AFTER SUBMIT -->
<div class="popup" id="pop"><div class="popbox"><h2>🎉 Test Finished!</h2><p id="ps"></p><p>Send this score to parent on WhatsApp?</p><input id="parentNum" placeholder="Parent WhatsApp e.g. 1876..."><button class="green" onclick="sendWA()">Send on WhatsApp 📲</button><button class="grey" onclick="closeP()">Close / Next Test →</button></div></div>

<script>
const T1=[
["What is 25% of 200?",["50","25","100","75"],0],
["What is the value of 5 in 5,432?",["5,000","500","50","5"],0],
["What is 3,456 rounded to nearest hundred?",["3,400","3,500","3,000","3,460"],1],
["Next: 4, 8, 12, 16, ...?",["18","20","24","22"],1],
["Which is a multiple of 6?",["13","18","25","31"],1],
["What is 1/2 + 1/2?",["1","1/4","2/4","2"],0],
["What is 3/4 - 1/4?",["2/4","1/4","1/2","2/2"],0],
["What is 1/3 of 12?",["3","4","6","12"],1],
["Which is equivalent to 1/2?",["2/4","1/4","3/2","2/2"],0],
["What is 7 x 8?",["54","56","64","48"],1],
["What is 96 ÷ 8?",["11","12","14","16"],1],
["What is 0.5 as fraction?",["1/2","1/5","5/1","1/10"],0],
["Which is largest? 0.3, 0.7, 0.5",["0.3","0.7","0.5","Equal"],1],
["What is 25% of 40?",["5","10","20","25"],1],
["Perimeter of square side 5 cm?",["10 cm","15 cm","20 cm","25 cm"],2],
["Area of rectangle 6 cm x 4 cm?",["10 cm²","24 cm²","20 cm²","18 cm²"],1],
["How many cm in 2 m?",["20","200","2000","2"],1],
["What is 1 kg in g?",["100 g","1000 g","10 g","10000 g"],1],
["What is 3.2 + 1.5?",["4.7","4.5","3.7","5.7"],0],
["What is 10 - 2 x 3?",["24","4","16","14"],1]
];
const T2=[
["What is 456 + 234?",["690","680","700","590"],0],
["What is 800 - 365?",["435","445","465","535"],0],
["What is 12 x 6?",["62","72","82","66"],1],
["What is 144 ÷ 12?",["11","12","14","16"],1],
["What is 2/5 + 1/5?",["3/5","2/10","3/10","1/5"],0],
["What is 5/6 - 1/6?",["4/6","5/6","1/6","6/6"],0],
["What is 3/4 of 16?",["4","8","12","16"],2],
["What is 0.75 as fraction?",["3/4","1/4","7/5","75/10"],0],
["What is 50% of 90?",["25","45","50","90"],1],
["What is 10% of 200?",["10","20","30","200"],1],
["How many minutes in 2 hours?",["60","120","180","200"],1],
["What is 1 hour 15 mins in mins?",["60","75","115","150"],1],
["Perimeter of rectangle 8 cm x 3 cm?",["11 cm","22 cm","24 cm","16 cm"],1],
["Area of square side 7 cm?",["14 cm²","28 cm²","49 cm²","70 cm²"],2],
["What is 2.5 L in mL?",["25","250","2500","25000"],2],
["What is 4.5 - 2.3?",["2.2","2.5","6.8","2.0"],0],
["Which is 0.25?",["25%","2.5%","250%","0.25%"],0],
["What is 3³?",["9","27","18","12"],1],
["If x + 7 = 15, x = ?",["7","8","15","22"],1],
["What is next: 2, 6, 18, 54, ...?",["72","108","162","216"],2]
];
const T3=[
["Sum of angles in triangle?",["90°","180°","270°","360°"],1],
["What is a right angle?",["45°","90°","180°","360°"],1],
["How many lines of symmetry in a rectangle?",["1","2","3","4"],1],
["What is 5 x n if n=9?",["14","45","54","95"],1],
["Which is a quadrilateral?",["Triangle","Square","Pentagon","Circle"],1],
["How many vertices in a cube?",["6","8","12","4"],1],
["What is 10 - 2 x 3?",["24","4","16","14"],1],
["An angle >90° and <180° is?",["Acute","Right","Obtuse","Reflex"],2],
["How many faces on a cube?",["4","5","6","8"],2],
["What is 2 + 3 x 4?",["20","14","18","10"],1],
["Perimeter of triangle 4,5,6 cm?",["15 cm","14 cm","16 cm","12 cm"],0],
["Which shape has 4 equal sides and 4 right angles?",["Rectangle","Square","Triangle","Trapezium"],1],
["How many degrees in a full turn?",["90°","180°","270°","360°"],3],
["If y = 4, 3y + 2 = ?",["14","12","10","9"],0],
["What is mean of 5,10,15?",["10","15","5","20"],0],
["What is mode of 3,3,5,7,3?",["3","5","7","1"],0],
["What is range of 4,9,12?",["4","8","9","12"],1],
["How many seconds in 3 mins?",["60","120","180","300"],2],
["What is 1/2 hour in mins?",["15","30","45","60"],1],
["How many days in Feb leap year?",["28","29","30","31"],1]
];
const T4=[
["What is 1/2 + 1/4?",["2/6","3/4","1/6","2/4"],1],
["What is 20% of 150?",["20","30","40","50"],1],
["What is 15 x 5?",["65","75","85","55"],1],
["What is 0.4 + 0.6?",["1.0","0.10","1.2","0.4"],0],
["Perimeter of square side 9 cm?",["18 cm","36 cm","81 cm","90 cm"],1],
["What is 2/3 of 15?",["5","10","15","20"],1],
["What is 1000 - 456?",["544","554","644","444"],0],
["What is angle in square corner?",["45°","90°","180°","60°"],1],
["What is mean of 6,8,10?",["6","8","10","24"],1],
["What is 2.5 x 4?",["10","8","6","12"],0],
["What is 6²?",["12","36","18","66"],1],
["What is 1/4 as %?",["4%","14%","25%","40%"],2],
["How many edges in a cube?",["6","8","12","10"],2],
["What is 48 ÷ 6?",["6","7","8","9"],2],
["What is 3.6 rounded to nearest whole?",["3","4","3.6","3.0"],1],
["Area of rectangle 7 x 3?",["10","21","24","18"],1],
["What is 1 kg - 250 g?",["750 g","250 g","500 g","1000 g"],0],
["Next: 3,6,12,24,...?",["30","36","48","72"],2],
["What is 4/10 in simplest form?",["2/5","4/2","1/4","4/5"],0],
["A shop sells 10 mangoes for $200. Cost of 1?",["$10","$20","$30","$200"],1]
];
const T5=[
["What is 7,890 rounded to nearest thousand?",["7,000","8,000","7,900","7,800"],1],
["What is 1/5 + 2/5?",["3/5","3/10","1/5","2/5"],0],
["What is 7/8 - 3/8?",["4/8","10/8","4/16","1/8"],0],
["What is 1/2 of 50?",["20","25","30","50"],1],
["What is 75% of 80?",["60","50","75","80"],0],
["What is 8 x 9?",["64","72","81","56"],1],
["What is 121 ÷ 11?",["10","11","12","13"],1],
["What is 0.9 + 0.4?",["1.3","0.13","1.0","0.9"],0],
["What is 5.5 x 10?",["0.55","55","5.05","550"],1],
["What is 1 m 25 cm in cm?",["125 cm","1025 cm","25 cm","150 cm"],0],
["Volume of cube side 4 cm?",["16 cm³","32 cm³","64 cm³","12 cm³"],2],
["What is 3:45 pm in 24h?",["15:45","13:45","3:45","03:45"],0],
["How many mm in 4 cm?",["4","40","400","4000"],1],
["What is 9.6 ÷ 3?",["3.2","32","0.32","96"],0],
["Which is heaviest? 1 kg, 800 g, 2 kg",["1 kg","800 g","2 kg","Equal"],2],
["What is 12.5% of 200?",["12.5","25","50","100"],1],
["What is LCM of 3 and 5?",["8","15","30","3"],1],
["What is HCF of 10 and 15?",["3","5","10","15"],1],
["What is 4.75 - 1.25?",["3.5","3.0","3.75","6.0"],0],
["A box has 24 pencils. 3 boxes have?",["27","48","72","96"],2]
];
const tests=[{name:"Test 1",qs:T1},{name:"Test 2",qs:T2},{name:"Test 3",qs:T3},{name:"Test 4",qs:T4},{name:"Test 5",qs:T5}];
let curTest=0, curQ=0, answers=[], locked=false, finalScore=0;
function renderTabs(){document.getElementById('tabs').innerHTML=tests.map((t,i)=>`<button class="tab ${i===curTest?'active':''}" onclick="switchTest(${i})">${t.name}</button>`).join('');}
function renderQ(){renderTabs();let q=tests[curTest].qs[curQ];document.getElementById('qhead').innerText=`📘 ${tests[curTest].name} - Question ${curQ+1} of 20`;document.getElementById('qtext').innerText=q[0];document.getElementById('opts').innerHTML=q[1].map((o,i)=>`<button class="opt ${answers[curQ]===i?'selected':''}" onclick="pick(${i})">${["A. ","B. ","C. ","D. "][i]+o}</button>`).join('');document.getElementById('nextBtn').style.display=curQ===19?'none':'block';document.getElementById('submitBtn').style.display=curQ===19?'block':'none';document.getElementById('result').innerText=locked?`Score: ${finalScore}/20 - Locked`:'';}
function pick(i){ if(locked) return; answers[curQ]=i; renderQ(); }
function nextQ(){ if(curQ<19){curQ++; renderQ();} }
function switchTest(i){ curTest=i; curQ=0; answers=[]; locked=false; finalScore=0; document.getElementById('result').innerText=''; renderQ(); }
function submitTest(){if(answers.length<20 || answers.includes(undefined)){ alert('Please answer all 20 questions'); return; }finalScore=0; tests[curTest].qs.forEach((q,i)=>{ if(answers[i]===q[2]) finalScore++; });locked=true; renderQ(); document.getElementById('ps').innerHTML=`Your score for <b>${tests[curTest].name}</b> is<br><span style="font-size:32px">${finalScore} / 20</span>`; document.getElementById('pop').classList.add('show');}
function sendWA(){let msg=`Grade 5 PEP Mathematics - ${tests[curTest].name} - Score: ${finalScore}/20 - MOE Aligned`;let num=document.getElementById('parentNum').value.replace(/[^0-9]/g,'');let url=num?`https://wa.me/${num}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;window.open(url,'_blank');}
function closeP(){document.getElementById('pop').classList.remove('show'); if(curTest<4){switchTest(curTest+1);}}
switchTest(0);
</script>
</body>
</html>
