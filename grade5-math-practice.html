<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 5 Practice - PEPLink JA</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0}
.header{background:#14532d;color:white;padding:25px;text-align:center;border-radius:0 0 18px 18px}
.header h1{margin:0;font-size:32px}
.header h2{margin:10px 0 5px}
.container{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
button{background:#14532d;color:white;border:none;padding:12px 18px;border-radius:8px;margin:5px;font-weight:bold;font-size:16px}
a{color:#14532d}
label{display:block;padding:8px 0}
</style>
</head>
<body>
<div class="header"><h1>PEPLink JA</h1><h2>Grade 5 Mathematics</h2><p>Practice Questions</p></div>
<div class="container">
<p>Choose the correct answer for each question.</p>

<div class="card"><h3>1. What is 25% of 200?</h3>
<label><input type="radio" name="q1" value="50"> 50</label>
<label><input type="radio" name="q1" value="25"> 25</label>
<label><input type="radio" name="q1" value="100"> 100</label></div>

<div class="card"><h3>2. Area of 12m x 8m?</h3>
<label><input type="radio" name="q2" value="96"> 96 sqm</label>
<label><input type="radio" name="q2" value="20"> 20</label>
<label><input type="radio" name="q2" value="96m"> 96m</label></div>

<div class="card"><h3>3. What is 7.5 + 2.35?</h3>
<label><input type="radio" name="q3" value="9.85"> 9.85</label>
<label><input type="radio" name="q3" value="9.75"> 9.75</label>
<label><input type="radio" name="q3" value="10.85"> 10.85</label></div>

<div class="card"><h3>4. Which fraction equals 75%?</h3>
<label><input type="radio" name="q4" value="3/4"> 3/4</label>
<label><input type="radio" name="q4" value="1/2"> 1/2</label>
<label><input type="radio" name="q4" value="2/3"> 2/3</label></div>

<div class="card"><h3>5. Tank 240L, 1/3 used. How much left?</h3>
<label><input type="radio" name="q5" value="160"> 160 litres</label>
<label><input type="radio" name="q5" value="80"> 80 litres</label>
<label><input type="radio" name="q5" value="120"> 120 litres</label></div>

<button onclick="check()">Check Answers</button>
<button onclick="location.reload()">Try Again</button>
<div id="score" style="font-weight:bold;margin-top:15px;font-size:18px"></div>
<a href="grade5.html" style="display:block;margin-top:20px">Back to Grade 5</a>
</div>
<script>
function check(){
let s=0;
if(document.querySelector('input[name="q1"]:checked')?.value=="50")s++;
if(document.querySelector('input[name="q2"]:checked')?.value=="96")s++;
if(document.querySelector('input[name="q3"]:checked')?.value=="9.85")s++;
if(document.querySelector('input[name="q4"]:checked')?.value=="3/4")s++;
if(document.querySelector('input[name="q5"]:checked')?.value=="160")s++;
document.getElementById('score').innerText="Score: "+s+" / 5";
}
</script>
</body>
</html>
