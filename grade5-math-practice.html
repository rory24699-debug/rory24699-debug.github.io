<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 5 Math Practice - PEPLink JA</title>
<style>body{font-family:Arial;background:#eef3f8} .header{background:#122f50;color:white;padding:25px;border-radius:0 0 25px 25px;text-align:center} .card{background:white;padding:20px;border-radius:15px;margin:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)} .opt{padding:12px;border-radius:25px;background:#f1f5f9;margin:6px 0;font-weight:bold} .opt.correct{background:#16a34a;color:white} .opt.wrong{background:#dc2626;color:white}</style>
</head>
<body>
<div class="header"><h2>PEPLink JA - Grade 5 Practice</h2></div>
<div class="card"><h3>1. What is 25% of 200?</h3><div class="opt" onclick="this.classList.add('correct')">A) 50</div><div class="opt" onclick="this.classList.add('wrong')">B) 25</div><div class="opt" onclick="this.classList.add('wrong')">C) 100</div></div>
<div class="card"><h3>2. Area of 12m x 8m?</h3><div class="opt" onclick="this.classList.add('wrong')">A) 20</div><div class="opt" onclick="this.classList.add('correct')">B) 96 sqm</div></div>
<div class="card"><button style="width:100%;padding:12px;background:#122f50;color:white;border-radius:25px;border:none" onclick="window.location.href='grade5.html'">Back to Grade 5</button></div>
</body>
</html>
