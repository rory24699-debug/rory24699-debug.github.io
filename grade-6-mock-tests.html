{name:"Batch 3 - Vocabulary",qs:[{q:"Meaning of reluctant?",o:["Unwilling","Eager","Happy","Brave"],a:0,e:"Reluctant = unwilling."},{q:"Synonym for abandon?",o:["Leave","Keep","Hold","Stay"],a:0,e:"Abandon = leave."},{q:"Antonym for scarce?",o:["Plentiful","Rare","Few","Little"],a:0,e:"Scarce opposite plentiful."},{q:"Meaning of devastated?",o:["Deeply upset","Slightly happy","Bored","Tired"],a:0,e:"Devastated = deeply upset."},{q:"Synonym for observe?",o:["Watch","Ignore","Hide","Forget"],a:0,e:"Observe = watch."},{q:"Antonym for ancient?",o:["Modern","Old","Historic","Aged"],a:0,e:"Ancient opposite modern."}]},
{name:"Batch 4 - Punctuation & Speech",qs:[{q:"Choose correct:",o:["Jada asked, Where are you going?","Jada asked Where are you going?","Jada asked, where are you going?","Jada asked where are you going."],a:0,e:"Direct question needs quotes + capital."},{q:"Which uses apostrophe correctly?",o:["The boys' books","The boy's books are","The boys books","The boys' book's"],a:0,e:"Boys' = plural possessive."},{q:"Where does colon go?",o:["Bring these: pencil, book, ruler.","Bring these pencil, book, ruler:","Bring: these pencil","Bring these pencil: book"],a:0,e:"Colon introduces list."},{q:"Choose correct:",o:["It's a beautiful day, isn't it?","Its a beautiful day, isnt it?","Its a beautiful day isn't it.","It's a beautiful day isnt it"],a:0,e:"It's + isn't need apostrophes."},{q:"Which is correct?",o:["Mr. Brown, who lives next door, is kind.","Mr Brown who lives next door is kind.","Mr. Brown who lives next door is kind","Mr. Brown, who lives next door is kind."],a:0,e:"Non-essential clause needs commas."},{q:"Which is correct?",o:["She said, I am coming.","She said I am coming.","She said, i am coming.","She said I am coming"],a:0,e:"Direct speech needs quotes."}]},
{name:"Batch 5 - Spelling",qs:[{q:"Which is correct?",o:["Accommodation","Accomodation","Accomodation","Acommodation"],a:0,e:"Accommodation is correct."},{q:"Which is correct?",o:["Embarrass","Embarass","Embarras","Embarras"],a:0,e:"Embarrass is correct."},{q:"Which is correct?",o:["Conscious","Concious","Conscious","Consious"],a:0,e:"Conscious is correct."},{q:"Which is correct?",o:["Occurrence","Occurence","Occurrance","Occurance"],a:0,e:"Occurrence is correct."},{q:"Which is correct?",o:["Discipline","Disipline","Disciplin","Descipline"],a:0,e:"Discipline is correct."},{q:"Which is correct?",o:["Recommend","Recomend","Reccomend","Recommmend"],a:0,e:"Recommend is correct."}]},
{name:"Batch 6 - Synonyms & Antonyms",qs:[{q:"Synonym for diligent?",o:["Hardworking","Lazy","Careless","Slow"],a:0,e:"Diligent = hardworking."},{q:"Antonym for arrogant?",o:["Humble","Proud","Rude","Bold"],a:0,e:"Arrogant opposite humble."},{q:"Synonym for vivid?",o:["Bright","Dull","Dark","Faint"],a:0,e:"Vivid = bright."},{q:"Antonym for expand?",o:["Contract","Grow","Increase","Stretch"],a:0,e:"Expand opposite contract."},{q:"Synonym for immense?",o:["Huge","Tiny","Small","Little"],a:0,e:"Immense = huge."},{q:"Antonym for victory?",o:["Defeat","Win","Success","Triumph"],a:0,e:"Victory opposite defeat."}]},
{name:"Batch 7 - Tenses & Verbs",qs:[{q:"By 2027, she ___ graduated.",o:["will have","has","have","had"],a:0,e:"Future perfect."},{q:"They ___ since morning.",o:["have been working","work","worked","working"],a:0,e:"Since = have been working."},{q:"If it rains, we ___ inside.",o:["will stay","stayed","stay","stays"],a:0,e:"First conditional = will stay."},{q:"Past perfect of go?",o:["Had gone","Has gone","Went","Gone"],a:0,e:"Had gone."},{q:"Choose correct: Neither the teacher nor the students ___ ready.",o:["were","was","is","has"],a:0,e:"Nearest subject students = were."},{q:"She ___ to Jamaica twice.",o:["has been","have been","is","was"],a:0,e:"She has been."}]},
{name:"Batch 8 - Sentences & Paragraphs",qs:[{q:"Which is a compound-complex sentence?",o:["Although it rained, we played, and we won.","We played.","It rained.","We played and won."],a:0,e:"Has dependent + 2 independent."},{q:"Best topic sentence?",o:["Pollution harms our rivers and health.","Rivers are blue.","Fish swim.","I like water."],a:0,e:"Topic about pollution."},{q:"Which is a fragment?",o:["Because she was tired.","She was tired.","She slept.","She was tired and slept."],a:0,e:"Because clause incomplete."},{q:"Which uses correct parallel structure?",o:["She likes reading, singing, and dancing.","She likes reading, sing, and dancing.","She likes to read, singing, and dance.","She likes reading, singing, and dance."],a:0,e:"All -ing forms."},{q:"Which is best concluding sentence?",o:["Therefore, we must protect our environment.","It is Monday.","The dog barked.","She went home."],a:0,e:"Conclusion sums up."},{q:"Which is a run-on?",o:["She ran she fell she cried.","She ran. She fell. She cried.","She ran and fell.","She ran, fell, and cried."],a:0,e:"Run-on joins without punctuation."}]},

function showHome(){location.reload();}
function showBatches(sub){
var main=document.getElementById("main");main.innerHTML="";
var h=document.createElement("h2");h.style.textAlign="center";h.textContent=DATA[sub].title;main.appendChild(h);
DATA[sub].batches.forEach(function(b,i){
var btn=document.createElement("button");btn.className="btn";btn.textContent=b.name;
btn.onclick=function(){openBatch(sub,i)};main.appendChild(btn);});
var back=document.createElement("button");back.className="btn back";back.textContent="Back to Subjects";back.onclick=showHome;main.appendChild(back);window.scrollTo(0,0);
}
function openBatch(sub,i){
var main=document.getElementById("main");main.innerHTML="";
var b=DATA[sub].batches[i];
var h=document.createElement("h2");h.style.textAlign="center";h.textContent=b.name;main.appendChild(h);
b.qs.forEach(function(q,qi){
var card=document.createElement("div");card.className="card";
var t=document.createElement("b");t.textContent="Q"+(qi+1)+". "+q.q;card.appendChild(t);
q.o.forEach(function(opt,oi){
var ob=document.createElement("button");ob.className="opt";ob.textContent=opt;
ob.onclick=function(){var btns=card.querySelectorAll(".opt");btns.forEach(function(x){x.disabled=true});ob.className="opt "+(oi===q.a?"correct":"wrong");exp.style.display="block"};card.appendChild(ob);});
var exp=document.createElement("div");exp.className="exp";exp.textContent=q.e;card.appendChild(exp);
main.appendChild(card);});
var back=document.createElement("button");back.className="btn back";back.textContent="Back to Batches";back.onclick=function(){showBatches(sub)};main.appendChild(back);window.scrollTo(0,0);
}
</script></body></html>
