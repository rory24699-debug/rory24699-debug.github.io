
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 6 Language Arts | PEPLink JA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#243247}
.header{background:#1a324f;color:white;text-align:center;padding:27px 15px;border-radius:0 0 22px 22px}
.header h1{font-size:25px;margin:0}
.header p{margin:9px 0 0}
.container{max-width:650px;margin:auto;padding:18px 14px}
.panel,.question,.result{background:white;padding:17px;border-radius:15px;margin-bottom:15px}
.panel{text-align:center}
.progress{height:10px;background:#ddd;border-radius:10px;overflow:hidden;margin:12px 0}
.bar{height:100%;width:0;background:#2d873f}
.batches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.batch{border:0;border-radius:9px;padding:12px 3px;background:#dce5f0;color:#1a324f;font-weight:bold}
.batch.active{background:#315b9b;color:white}
.batch.done{background:#2d873f;color:white}
.question h3{font-size:17px;line-height:1.5}
.number{font-size:14px;color:#315b9b;font-weight:bold}
.option{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:2px solid #dce3ec;border-radius:10px;background:white;font-size:15px;cursor:pointer}
.option.selected{border-color:#315b9b;background:#edf3fc}
.option.correct{border-color:#21843b;background:#e5f5e9}
.option.wrong{border-color:#c62828;background:#ffeded}
.option:disabled{opacity:1}
.feedback{display:none;padding:12px;border-radius:9px;margin-top:12px;line-height:1.5}
.feedback.show{display:block}
.good{background:#e5f5e9;color:#155b27}
.bad{background:#ffeded;color:#9c2020}
button.action{width:100%;padding:15px;border:0;border-radius:11px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}
.primary{background:#315b9b;color:white}
.green{background:#20a94b;color:white}
.dark{background:#363636;color:white}
button:disabled{opacity:.45}
.result{text-align:center;display:none}
.score{font-size:35px;font-weight:bold;color:#21843b}
.back{display:block;text-align:center;text-decoration:none;background:#363636;color:white;padding:17px;border-radius:12px;font-weight:bold;margin-top:20px}
.small{font-size:13px;color:#667085}
</style>
</head>
<body>

<div class="header">
<h1>Grade 6 - Language Arts</h1>
<p>Performance Task Preparation</p>
</div>

<div class="container">

<div class="panel">
<strong>PEPLink JA Language Arts Practice</strong>
<p>Reading, Grammar, Vocabulary, Research, Writing & Communication</p>
<strong>10 Batches | 10 Questions Each</strong>
<div id="progressText">Questions completed: 0 of 100</div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="batches" id="batchButtons"></div>

<div class="question" id="quiz">
<div class="number" id="number"></div>
<h3 id="questionText"></h3>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="action primary" id="next" disabled onclick="nextQuestion()">Next Question ➜</button>
</div>

<div class="result" id="result">
<h2 id="resultTitle">Batch Complete!</h2>
<div class="score" id="score"></div>
<p id="message"></p>
<p id="total"></p>
<button class="action primary" onclick="nextBatch()">Next Batch ➜</button>
<button class="action green" onclick="shareScore()">🟢 Send Score to Parent on WhatsApp</button>
</div>

<a class="back" href="grade6-pep-practice.html">⬅ Back to PEP Practice</a>
<p class="small" style="text-align:center">PEPLink JA | Grade 6</p>
</div>

<script>

],
[
["Which source is most suitable for researching Jamaica's national symbols?",["An official government website","An anonymous comment","An unrelated advertisement","A fictional story"],0,"An official government source is more reliable."],
["What information is usually found in a book's table of contents?",["The author's home address","Chapters and page numbers","The reader's name","The book's price only"],1,"The table of contents helps locate sections."],
["Why should a researcher compare information from different reliable sources?",["To make research longer","To avoid reading","To check accuracy","To copy more words"],2,"Comparing sources helps check facts."],
["Which is a suitable keyword for researching coral reefs?",["My favourite food","Coral reef conservation","School shoes","Football practice"],1,"The keyword directly relates to the topic."],

["Which is the best way to take research notes?",["Copy an entire book","Record key points in your own words","Write without checking sources","Ignore important facts"],1,"Notes should capture important ideas in your own words."]
],
[
["Which sentence is the clearest way to make a request?",["Give me that now!","Could you please lend me your ruler?","You must do it.","Ruler, now."],1,"Polite language makes a request clear and respectful."],
["What is the purpose of a persuasive paragraph?",["To entertain only","To convince the reader","To list random words","To tell a fairy tale"],1,"Persuasive writing aims to convince."],
["Which detail best supports the claim that exercise is beneficial?",["Exercise improves fitness and strengthens the heart.","Some people own shoes.","The park has trees.","Monday comes after Sunday."],0,"This detail gives a relevant reason."],
["What should a speaker do when presenting to an audience?",["Speak too quietly","Face away from listeners","Speak clearly and make eye contact","Read without pausing"],2,"Clear speech and eye contact help communication."],
["Which is the best opening for a formal letter?",["Hey buddy!","Dear Principal,","What's up?","Hi everybody!!!"],1,"Dear Principal is suitable for a formal letter."],
["Which word makes this sentence more precise: 'The food was good'?",["Nice","Tasty","Okay","Fine"],1,"Tasty gives a more specific description."],
["What is the purpose of an introduction in a report?",["To introduce the topic","To list every reference","To repeat the conclusion","To change the subject"],0,"The introduction tells readers what the report is about."],
["Which sentence is most suitable for a school notice?",["Come if you feel like it.","Students are invited to attend the meeting at 2:00 p.m.","Hey, show up!","Maybe there is a meeting."],1,"It gives clear and formal information."],
["What should you do if a listener does not understand your explanation?",["Become angry","Ignore the listener","Explain the idea another way","End the conversation"],2,"Rephrasing can make the message clearer."],
["Which is an example of persuasive language?",["The meeting starts at noon.","Everyone should help keep our school clean.","The bag is on the desk.","Yesterday was rainy."],1,"It encourages readers to take action."]
],
[
["Choose the correct sentence.",["The information are useful.","The information is useful.","The informations are useful.","The information were useful."],1,"Information is an uncountable noun and takes is."],
["Which word means 'to examine carefully'?",["Ignore","Inspect","Forget","Avoid"],1,"Inspect means to examine carefully."],
["Choose the correct word: Please _____ your name at the top.",["Write","Right","Rite","Wright"],0,"Write means to form words on paper."],
["Which sentence uses direct speech correctly?",["Mia said I am ready.","Mia said, 'I am ready.'","Mia said I, am ready.","Mia said 'I am ready"],1,"Quotation marks show the exact words spoken."],
["Which word is a pronoun?",["School","They","Beautiful","Quickly"],1,"They replaces the name of people."],
["What is the plural of 'library'?",["Librarys","Libraryes","Libraries","Library"],2,"Change the y to ies."],
["Which sentence has the correct comparison?",["This book is more better.","This book is best than that one.","This book is better than that one.","This book is gooder."],2,"Better is the correct comparative form."],
["Which word is closest in meaning to 'observe'?",["Notice","Destroy","Forget","Hide"],0,"Observe means to watch or notice."],
["Choose the correct word: The dog wagged _____ tail.",["it's","its","it","its'"],1,"Its shows possession; it's means it is."],
["Which sentence is written in the future tense?",["We visited the museum.","We visit the museum.","We are visiting the museum.","We will visit the museum."],3,"Will visit describes a future action."]
],
[
["A paragraph describes a community cleaning a beach together. What is the likely theme?",["Cooperation","Jealousy","Dishonesty","Competition"],0,"The community works together toward a shared goal."],
["Which detail is most relevant to a report about road safety?",["Road signs help drivers and pedestrians.","The school has a new library.","Many children enjoy music.","The market sells fruit."],0,"Road signs directly relate to road safety."],
["What is the best way to arrange instructions?",["Randomly","In the order they should be completed","Alphabetically by every word","By paragraph length"],1,"Instructions should follow a logical sequence."],
["Which word signals a result?",["However","Although","Therefore","Meanwhile"],2,"Therefore introduces a result or conclusion."],
["What does the phrase 'once in a blue moon' mean?",["Every day","Very rarely","At night only","Very quickly"],1,"The expression means something happens rarely."],
["Which sentence is an opinion?",["Jamaica is an island.","Kingston is the capital of Jamaica.","The school has 500 students.","Reading is the most enjoyable subject."],3,"Enjoyment is a personal judgement."],
["What should a writer do before submitting a report?",["Ignore spelling","Check grammar, spelling and punctuation","Remove the title","Delete the conclusion"],1,"Proofreading helps correct errors."],
["Which is the best title for a passage about reducing plastic waste?",["A Day at School","Keeping Our Environment Free of Plastic","My Favourite Sport","The History of Football"],1,"The title reflects the passage's main subject."],
["What does 'sequence' mean?",["The order in which events happen","A list of opinions","A type of punctuation","The meaning of a word"],0,"Sequence refers to the order of events."],
["Which sentence best summarizes a story about students planting trees to improve their community?",["The students wore uniforms.","The students worked together to make their community greener.","The school has several classrooms.","One student brought a shovel."],1,"It captures the main event and purpose."]
],
[

[

let currentBatch=0;
let currentQuestion=0;
let batchScores=Array(10).fill(null);
let batchAnswers=Array.from({length:10},()=>Array(10).fill(null));
let lastScore=0;

const $=id=>document.getElementById(id);

function renderBatchButtons(){
$("batchButtons").innerHTML="";
batches.forEach((b,i)=>{
let btn=document.createElement("button");
btn.className="batch"+(i===currentBatch?" active":"")+(batchScores[i]!==null?" done":"");
btn.textContent="Batch "+(i+1);
btn.onclick=()=>openBatch(i);
$("batchButtons").appendChild(btn);
});
updateProgress();
}

function updateProgress(){
let completed=batchAnswers.reduce((n,a)=>n+a.filter(x=>x!==null).length,0);
$("progressText").textContent="Questions completed: "+completed+" of 100";
$("bar").style.width=(completed)+"%";
}

function openBatch(i){
currentBatch=i;
currentQuestion=0;
$("result").style.display="none";
$("quiz").style.display="block";
renderBatchButtons();
showQuestion();
}

function showQuestion(){
let q=batches[currentBatch][currentQuestion];
$("number").textContent="Batch "+(currentBatch+1)+" - Question "+(currentQuestion+1)+" of 10";
$("questionText").textContent=q[0];
$("options").innerHTML="";
$("feedback").className="feedback";
$("feedback").textContent="";
$("next").disabled=true;
$("next").textContent=currentQuestion===9?"Finish Batch":"Next Question ➜";

q[1].forEach((option,i)=>{
let btn=document.createElement("button");
btn.className="option";
btn.textContent=String.fromCharCode(65+i)+". "+option;
btn.onclick=()=>selectAnswer(i);
$("options").appendChild(btn);
});

let saved=batchAnswers[currentBatch][currentQuestion];
if(saved!==null) showSavedAnswer(saved);
}

function showSavedAnswer(selected){
let q=batches[currentBatch][currentQuestion];
let buttons=$("options").querySelectorAll("button");
buttons.forEach((btn,i)=>{
btn.disabled=true;
if(i===q[2])btn.classList.add("correct");
else if(i===selected)btn.classList.add("wrong");
});
let right=selected===q[2];
$("feedback").className="feedback show "+(right?"good":"bad");
$("feedback").textContent=(right?"Correct! ":"Not quite. Correct answer: "+String.fromCharCode(65+q[2])+". ")+q[3];
$("next").disabled=false;
}

function selectAnswer(i){
if(batchAnswers[currentBatch][currentQuestion]!==null)return;
batchAnswers[currentBatch][currentQuestion]=i;
let q=batches[currentBatch][currentQuestion];
let buttons=$("options").querySelectorAll("button");
buttons.forEach((btn,j)=>{
btn.disabled=true;
if(j===q[2])btn.classList.add("correct");
else if(j===i)btn.classList.add("wrong");
});
let right=i===q[2];
$("feedback").className="feedback show "+(right?"good":"bad");
$("feedback").textContent=(right?"Correct! ":"Incorrect. Correct answer: "+String.fromCharCode(65+q[2])+". ")+q[3];
$("next").disabled=false;
updateProgress();
}

function nextQuestion(){
if(batchAnswers[currentBatch][currentQuestion]===null)return;
if(currentQuestion<9){
currentQuestion++;
showQuestion();
}else{
finishBatch();
}
}

function finishBatch(){
let answers=batchAnswers[currentBatch];
lastScore=answers.reduce((score,answer,i)=>score+(answer===batches[currentBatch][i][2]?1:0),0);
batchScores[currentBatch]=lastScore;
$("quiz").style.display="none";
$("result").style.display="block";
$("resultTitle").textContent="Batch "+(currentBatch+1)+" Completed!";
$("score").textContent=lastScore+" / 10";
$("message").textContent=lastScore>=8?"Excellent work! Keep it up.":lastScore>=5?"Good effort. Review the explanations and keep practising.":"Keep practising. Review the explanations and try again.";
let total=batchScores.reduce((n,s)=>n+(s===null?0:s),0);
let done=batchScores.filter(s=>s!==null).length;
$("total").textContent="Overall score: "+total+" / "+(done*10)+" across "+done+" completed batches.";
$("next").disabled=true;
renderBatchButtons();
}

function nextBatch(){
let next=batches.findIndex((b,i)=>batchScores[i]===null);
if(next===-1){
$("resultTitle").textContent="All 10 Batches Completed!";
$("message").textContent="Congratulations! You have completed all 100 questions.";
$("total").textContent="Final score: "+batchScores.reduce((a,b)=>a+b,0)+" / 100";
$("result").style.display="block";
return;
}
openBatch(next);
}

function shareScore(){
let total=batchScores.reduce((n,s)=>n+(s===null?0:s),0);
let done=batchScores.filter(s=>s!==null).length;
let message="PEPLink JA - Grade 6 Language Arts Performance Task Practice%0A"+
"Batch "+(currentBatch+1)+" score: "+lastScore+"/10%0A"+
"Batches completed: "+done+"/10%0A"+
"Overall score: "+total+"/"+(done*10)+"%0A"+
"Keep practising!";
window.open("https://wa.me/?text="+message,"_blank");
}

renderBatchButtons();
showQuestion();
</script>
</body>
</html>
