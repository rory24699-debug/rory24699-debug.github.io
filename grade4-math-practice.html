<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 4 PEP - Mathematics</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:12px}
.card{max-width:650px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h1{text-align:center;font-size:22px;margin:0}
.sub{text-align:center;color:#555;margin:10px 0 15px}
.qhead{font-size:15px;color:#333;margin-bottom:8px}
.qtext{font-size:20px;font-weight:bold;margin-bottom:15px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1.5px solid #ddd;border-radius:12px;background:#fff;font-size:17px;cursor:pointer;box-sizing:border-box}
.opt.selected{border-color:#2563eb;background:#dbeafe}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
#nextBtn{background:#1e3a5f;color:#fff}
#submitBtn{background:#2563eb;color:#fff;display:none}
#waBtn{background:#25D366;color:#fff;display:none}
#result{text-align:center;font-size:18px;font-weight:bold;margin-top:12px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px;box-sizing:border-box}
.small{text-align:center;color:#666;font-size:13px;margin-top:6px}
.homeBtn{display:block;text-align:center;text-decoration:none;background:#f1f5f9;color:#111;padding:12px;border-radius:10px;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>🇯🇲 Grade 4 PEP - Mathematics<br>5 Questions</h1>
<div class="sub">Score is locked - no cheating</div>
<div class="qhead" id="qhead"></div>
<div class="qtext" id="qtext"></div>
<div id="opts"></div>
<button class="btn" id="nextBtn" onclick="nextQ()">Next ➡️</button>
<button class="btn" id="submitBtn" onclick="submitTest()">Submit Test</button>
<div id="result"></div>
<input type="text" id="parentNum" placeholder="Optional: Type parent WhatsApp number e.g. 18765432100">
<button class="btn" id="waBtn" onclick="sendWA()">📱 Send Report to WhatsApp</button>
<div class="small">Leave number blank to pick any parent/contact in WhatsApp</div>
<a href="javascript:history.back()" class="homeBtn">⬅️ Go back to PEP Centre</a>
</div>
<script>
const T1=[
["What is 248 + 135?",["373","383","393"],1],
["What is 9 × 7?",["56","63","72"],1],
["What is 600 − 275?",["325","335","425"],0],
["Which fraction is equal to one-half?",["2/3","3/4","2/4"],2],
["A box contains 24 pencils. They are shared equally among 6 students. How many pencils does each student receive?",["3","4","6"],1]
];
let curQ=0, answers=[], locked=false, finalScore=0;
function renderQ(){
let q=T1[curQ];
document.getElementById('qhead').innerText=`📘 Question ${curQ+1} of 5`;
document.getElementById('qtext').innerText=q[0];
document.getElementById('opts').innerHTML=q[1].map((o,i)=>`<button class="opt ${answers[curQ]===i?'selected':''}" onclick="pick(${i})">${o}</button>`).join('');
document.getElementById('nextBtn').style.display=curQ===4?'none':'block';
document.getElementById('submitBtn').style.display=curQ===4?'block':'none';
document.getElementById('result').innerText=locked?`Score: ${finalScore}/5 - Locked`:'';
document.getElementById('waBtn').style.display=locked?'block':'none';
}
function pick(i){ if(locked) return; answers[curQ]=i; renderQ(); }
function nextQ(){ if(curQ<4){curQ++; renderQ();} }
function submitTest(){
if(answers.length<5 || answers.includes(undefined)){ alert('Please answer all 5 questions'); return; }
finalScore=0; T1.forEach((q,i)=>{ if(answers[i]===q[2]) finalScore++; });
locked=true; renderQ();
}
function sendWA(){
let msg=`Grade 4 PEP Mathematics - Score: ${finalScore}/5 - MOE Aligned`;
let num=document.getElementById('parentNum').value.replace(/[^0-9]/g,'');
let url=num?`https://wa.me/${num}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
window.open(url,'_blank');
}
renderQ();
</script>
</body>
</html>
