<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 6 Math</title>
<style>
body{font-family:Arial;padding:12px;background:#f0f4f8}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.btn{padding:12px;background:#174a7e;color:#fff;border-radius:12px;text-decoration:none;display:block;text-align:center;margin:8px 0;border:0;width:100%}
.opt{padding:10px;border:2px solid #e2e8f0;border-radius:10px;margin:6px 0}
.opt.sel{background:#dbeafe;border-color:#174a7e}
.progress{height:12px;background:#e2e8f0;border-radius:10px;overflow:hidden}
.bar{height:100%;background:#16a34a;width:0%}
</style>
</head>
<body>
<div style="max-width:700px;margin:0 auto">
<div class="card" style="background:#174a7e;color:#fff;text-align:center">
<h2 style="margin:0">Grade 6 - Mathematics</h2>
<div class="progress" style="margin-top:10px"><div id="bar" class="bar"></div></div>
<p id="txt" style="font-size:13px">Progress: 0%</p>
</div>
<div class="card">
<h3>🧠 Quiz: Fractions</h3>
<p><b>Q1. What is 3/4 + 1/2?</b></p>
<div class="opt" onclick="a1=1;this.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')">A) 4/6</div>
<div class="opt" onclick="a1=2;this.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')">B) 1 1/4</div>
<div class="opt" onclick="a1=1;this.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')">C) 1/2</div>
<p><b>Q2. 3/4 = ?%</b></p>
<div class="opt" onclick="a2=1;this.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')">A) 25%</div>
<div class="opt" onclick="a2=2;this.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')">B) 75%</div>
<button class="btn" style="background:#16a34a" onclick="check()">Submit Quiz</button>
<div id="res" style="margin-top:10px;font-weight:bold"></div>
</div>
<button class="btn" style="background:#25D366" onclick="shareWA()">📱 Send Report to WhatsApp</button>
<a class="btn" style="background:#64748b" href="grade6.html">← Back</a>
</div>
<script>
let a1=0,a2=0;
function check(){
 let score=0;
 if(a1==2)score++;
 if(a2==2)score++;
 document.getElementById("res").innerHTML="Score: "+score+"/2 - "+(score==2?"✅ Strong!":"⚠️ Weak Area: Fractions");
 localStorage.setItem("math_quiz","yes");
 localStorage.setItem("math_score",score);
 update();
}
function shareWA(){
 let score=localStorage.getItem("math_score")||0;
 let msg="PeplinkJA Report - Grade 6 Math%0AMy child scored "+score+"/2%0AProgress: "+document.getElementById("txt").innerText+"%0A%0ASite: https://rory24699-debug.github.io/grade6-mathematics.html";
 window.open("https://wa.me/?text="+msg,"_blank");
}
function update(){
 let tot=(localStorage.getItem("math_video")?50:0)+(localStorage.getItem("math_quiz")?50:0);
 if(!localStorage.getItem("math_video")){localStorage.setItem("math_video","yes");tot=50;}
 if(localStorage.getItem("math_quiz")) tot=100;
 document.getElementById("bar").style.width=tot+"%";
 document.getElementById("txt").innerText="Progress: "+tot+"%";
}
update();
</script>
</body>
</html>
